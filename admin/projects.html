<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Projects | STI Academy Admin</title>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#050505;
    color:#fff;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.header{
    margin-bottom:25px;
}

.header h1{
    font-size:28px;
    margin-bottom:8px;
}

.header p{
    color:#aaa;
    font-size:14px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat-card{
    background:#101010;
    border:1px solid #242424;
    border-radius:12px;
    padding:20px;
}

.stat-card h3{
    color:#aaa;
    font-size:13px;
    margin-bottom:10px;
}

.stat-card strong{
    font-size:28px;
    color:#1683ff;
}

.card{
    background:#101010;
    border:1px solid #242424;
    border-radius:12px;
    padding:22px;
    margin-bottom:25px;
}

.card h2{
    font-size:20px;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    font-size:13px;
    color:#ccc;
}

input,
select,
textarea{
    width:100%;
    background:#080808;
    color:#fff;
    border:1px solid #303030;
    border-radius:8px;
    padding:12px;
    outline:none;
    font-size:14px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#1683ff;
}

textarea{
    min-height:110px;
    resize:vertical;
}

button{
    border:none;
    border-radius:8px;
    padding:11px 16px;
    cursor:pointer;
    font-weight:bold;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.primary{
    background:#1683ff;
    color:#fff;
}

.primary:hover{
    opacity:.9;
}

.secondary{
    background:#222;
    color:#fff;
}

.danger{
    background:#b91c1c;
    color:#fff;
}

.form-actions{
    margin-top:18px;
    display:flex;
    gap:10px;
}

.hidden{
    display:none !important;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th,
td{
    padding:13px 10px;
    border-bottom:1px solid #242424;
    text-align:left;
    font-size:13px;
}

th{
    color:#aaa;
    font-weight:600;
}

td{
    color:#eee;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.badge-active{
    background:#123e67;
    color:#65b5ff;
}

.badge-inactive{
    background:#3b1717;
    color:#ff8d8d;
}

.badge-submitted{
    background:#183b57;
    color:#6ebcff;
}

.badge-graded{
    background:#163d24;
    color:#72dc95;
}

.empty{
    padding:25px;
    text-align:center;
    color:#888;
}

.loading{
    padding:20px;
    text-align:center;
    color:#888;
}

.message{
    margin-bottom:15px;
    padding:12px;
    border-radius:8px;
    display:none;
    font-size:13px;
}

.message.success-message{
    display:block;
    background:#12361f;
    color:#8ce0a5;
}

.message.error-message{
    display:block;
    background:#3d1717;
    color:#ff9999;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:999;
}

.modal.show{
    display:flex;
}

.modal-content{
    background:#101010;
    border:1px solid #303030;
    border-radius:12px;
    width:100%;
    max-width:700px;
    max-height:90vh;
    overflow-y:auto;
    padding:22px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.modal-header h2{
    font-size:20px;
}

.close{
    background:#222;
    color:#fff;
    width:35px;
    height:35px;
    padding:0;
    border-radius:50%;
}

.submission-card{
    background:#080808;
    border:1px solid #292929;
    border-radius:10px;
    padding:16px;
    margin-bottom:12px;
}

.submission-card h3{
    font-size:16px;
    margin-bottom:8px;
}

.submission-card p{
    color:#aaa;
    font-size:13px;
    margin:5px 0;
    line-height:1.5;
}

.submission-actions{
    margin-top:12px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.link-btn{
    display:inline-block;
    text-decoration:none;
    background:#1683ff;
    color:#fff;
    padding:9px 12px;
    border-radius:7px;
    font-size:12px;
    font-weight:bold;
}

.answer-box{
    margin-top:14px;
    padding:14px;
    background:#111;
    border:1px solid #292929;
    border-radius:8px;
}

.answer-title{
    color:#1683ff;
    font-size:13px;
    font-weight:bold;
    margin-bottom:8px;
}

.answer-content{
    color:#ddd;
    font-size:14px;
    line-height:1.7;
    white-space:pre-wrap;
    word-break:break-word;
}

.grade-summary{
    margin-top:14px;
    padding:14px;
    background:#0d2416;
    border:1px solid #214b2d;
    border-radius:8px;
}

.grade-summary p{
    color:#ddd;
}

@media(max-width:900px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    body{
        padding:12px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .card{
        padding:16px;
    }

}

</style>

</head>


<body>

<div class="container">

    <div class="header">

        <h1>
            Projects
        </h1>

        <p>
            Create, manage, view and grade student projects.
        </p>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat-card">

            <h3>
                Total Projects
            </h3>

            <strong id="totalProjects">
                0
            </strong>

        </div>


        <div class="stat-card">

            <h3>
                Active Projects
            </h3>

            <strong id="activeProjects">
                0
            </strong>

        </div>


        <div class="stat-card">

            <h3>
                Total Students
            </h3>

            <strong id="totalStudents">
                0
            </strong>

        </div>


        <div class="stat-card">

            <h3>
                Courses
            </h3>

            <strong id="totalCourses">
                0
            </strong>

        </div>

    </div>


    <!-- CREATE / EDIT PROJECT -->

    <div class="card">

        <h2 id="formTitle">
            Create Project
        </h2>


        <form id="projectForm">

            <div class="form-grid">

                <div class="form-group full">

                    <label>
                        Project Title
                    </label>

                    <input
                        type="text"
                        id="projectTitle"
                        placeholder="Enter project title"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Course Name
                    </label>

                    <select
                        id="courseSelect"
                        required
                    >

                        <option value="">
                            Select Course
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Cohort
                    </label>

                    <select id="cohortSelect">

                        <option value="">
                            Select Cohort
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Total Marks
                    </label>

                    <input
                        type="number"
                        id="totalMarks"
                        value="100"
                        min="1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Deadline
                    </label>

                    <input
                        type="datetime-local"
                        id="deadline"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Status
                    </label>

                    <select id="projectStatus">

                        <option value="active">
                            Active
                        </option>

                        <option value="inactive">
                            Inactive
                        </option>

                    </select>

                </div>


                <div class="form-group full">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Describe the project..."
                    ></textarea>

                </div>


                <div class="form-group full">

                    <label>
                        Instructions
                    </label>

                    <textarea
                        id="instructions"
                        placeholder="Give students instructions for the project..."
                    ></textarea>

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="primary"
                    id="saveProjectBtn"
                >
                    Create Project
                </button>


                <button
                    type="button"
                    class="secondary hidden"
                    id="cancelEditBtn"
                >
                    Cancel Edit
                </button>

            </div>

        </form>

    </div>


    <!-- PROJECTS -->

    <div class="card">

        <h2>
            All Projects
        </h2>


        <div id="projectsContainer">

            <div class="loading">
                Loading projects...
            </div>

        </div>

    </div>


    <!-- STUDENTS -->

    <div class="card">

        <h2>
            All Students
        </h2>


        <div id="studentsContainer">

            <div class="loading">
                Loading students...
            </div>

        </div>

    </div>

</div>


<!-- SUBMISSIONS MODAL -->

<div
    class="modal"
    id="submissionsModal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="submissionsTitle">
                Project Submissions
            </h2>


            <button
                type="button"
                class="close"
                onclick="closeSubmissionsModal()"
            >
                ×
            </button>

        </div>


        <div id="submissionsContainer">

            <div class="loading">
                Loading submissions...
            </div>

        </div>

    </div>

</div>


<!-- GRADE MODAL -->

<div
    class="modal"
    id="gradeModal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                Grade Project
            </h2>


            <button
                type="button"
                class="close"
                onclick="closeGradeModal()"
            >
                ×
            </button>

        </div>


        <form id="gradeForm">

            <input
                type="hidden"
                id="gradeSubmissionId"
            >


            <div class="form-group">

                <label>
                    Student
                </label>

                <input
                    type="text"
                    id="gradeStudentName"
                    readonly
                >

            </div>


            <br>


            <div class="form-group">

                <label>
                    Project
                </label>

                <input
                    type="text"
                    id="gradeProjectTitle"
                    readonly
                >

            </div>


            <br>


            <div class="form-group">

                <label>
                    Total Marks
                </label>

                <input
                    type="number"
                    id="gradeTotalMarks"
                    readonly
                >

            </div>


            <br>


            <div class="form-group">

                <label>
                    Score
                </label>

                <input
                    type="number"
                    id="gradeScore"
                    min="0"
                    required
                >

            </div>


            <br>


            <div class="form-group">

                <label>
                    Feedback
                </label>

                <textarea
                    id="gradeFeedback"
                    placeholder="Add feedback for the student..."
                ></textarea>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="primary"
                    id="saveGradeBtn"
                >
                    Save Grade
                </button>


                <button
                    type="button"
                    class="secondary"
                    onclick="closeGradeModal()"
                >
                    Cancel
                </button>

            </div>

        </form>

    </div>

</div>


<script>

const firebaseConfig = {

    apiKey:
        "AIzaSyBHa_irkP8QFgCQjUqTKlqdmv5cf8Ec4hg",

    authDomain:
        "sti-academy.firebaseapp.com",

    projectId:
        "sti-academy",

    storageBucket:
        "sti-academy.firebasestorage.app",

    messagingSenderId:
        "709840261642",

    appId:
        "1:709840261642:web:714b09bf661afa159f27ff",

    measurementId:
        "G-7ZRZ3P28YP"

};


firebase.initializeApp(
    firebaseConfig
);


const auth =
    firebase.auth();


const db =
    firebase.firestore();


let currentUser = null;

let courses = [];

let cohorts = [];

let projects = [];

let students = [];

let editingProjectId = null;


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function showMessage(
    message,
    type = "success"
){

    const box =
        document.getElementById(
            "message"
        );


    box.textContent =
        message;


    box.className =
        "message " +
        (
            type === "error"
                ? "error-message"
                : "success-message"
        );


    setTimeout(
        () => {

            box.className =
                "message";

        },
        4000
    );

}


function getCourseName(data){

    return (
        data.courseName ||
        data.name ||
        data.title ||
        data.course ||
        ""
    );

}


function getCourseId(
    data,
    docId
){

    return (
        data.courseId ||
        data.id ||
        docId
    );

}


function getCohortName(data){

    return (
        data.cohortName ||
        data.name ||
        data.title ||
        data.cohort ||
        ""
    );

}


function getCohortCourseId(data){

    return (
        data.courseId ||
        data.course ||
        ""
    );

}


function getStudentCourse(student){

    return (
        student.courseName ||
        student.course ||
        ""
    );

}


function getStudentName(student){

    return (
        student.fullName ||
        student.name ||
        "Unnamed Student"
    );

}


function getProjectCourseName(project){

    return (
        project.courseName ||
        project.course ||
        ""
    );

}


function formatDate(value){

    if(!value){

        return "Not set";

    }


    try{

        let date;


        if(
            value &&
            typeof value.toDate ===
                "function"
        ){

            date =
                value.toDate();

        }else{

            date =
                new Date(value);

        }


        if(
            isNaN(
                date.getTime()
            )
        ){

            return "Not set";

        }


        return date.toLocaleString();

    }catch(error){

        return "Not set";

    }

}


function normalizeUrl(url){

    if(!url){

        return "";

    }


    url =
        String(url).trim();


    if(
        url.startsWith("http://") ||
        url.startsWith("https://")
    ){

        return url;

    }


    return "https://" + url;

}


/* =========================
   AUTH
========================= */

auth.onAuthStateChanged(
    async user => {

        if(!user){

            window.location.href =
                "../login.html";

            return;

        }


        currentUser =
            user;


        try{

            const userDoc =
                await db
                .collection("users")
                .doc(user.uid)
                .get();


            if(
                !userDoc.exists ||
                userDoc.data().role !==
                    "admin"
            ){

                alert(
                    "Access denied."
                );


                window.location.href =
                    "../index.html";

                return;

            }


            await loadCourses();

            await loadCohorts();

            await loadProjects();

            await loadStudents();


        }catch(error){

            console.error(error);


            showMessage(
                "Unable to load the page: " +
                error.message,
                "error"
            );

        }

    }
);


/* =========================
   COURSES
========================= */

async function loadCourses(){

    const snapshot =
        await db
        .collection("courses")
        .get();


    courses = [];


    snapshot.forEach(
        doc => {

            const data =
                doc.data();


            courses.push({

                id:
                    doc.id,

                ...data,

                courseId:
                    getCourseId(
                        data,
                        doc.id
                    ),

                courseName:
                    getCourseName(
                        data
                    )

            });

        }
    );


    renderCourseOptions();


    document.getElementById(
        "totalCourses"
    ).textContent =
        courses.length;

}


/* =========================
   COURSE OPTIONS
========================= */

function renderCourseOptions(){

    const select =
        document.getElementById(
            "courseSelect"
        );


    select.innerHTML = `
        <option value="">
            Select Course
        </option>
    `;


    courses.forEach(
        course => {

            const name =
                course.courseName ||
                course.name ||
                course.title ||
                course.course ||
                course.id;


            const id =
                course.courseId ||
                course.id;


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                id;


            option.textContent =
                name;


            option.dataset.courseName =
                name;


            select.appendChild(
                option
            );

        }
    );

}


/* =========================
   COHORTS
========================= */

async function loadCohorts(){

    const snapshot =
        await db
        .collection("cohorts")
        .get();


    cohorts = [];


    snapshot.forEach(
        doc => {

            const data =
                doc.data();


            cohorts.push({

                id:
                    doc.id,

                ...data,

                cohortName:
                    getCohortName(
                        data
                    ),

                courseId:
                    getCohortCourseId(
                        data
                    )

            });

        }
    );


    renderCohortOptions();

}


/* =========================
   COHORT OPTIONS
========================= */

function renderCohortOptions(
    courseId = ""
){

    const select =
        document.getElementById(
            "cohortSelect"
        );


    select.innerHTML = `
        <option value="">
            Select Cohort
        </option>
    `;


    let list =
        cohorts;


    if(courseId){

        const filtered =
            cohorts.filter(
                cohort => {

                    return String(
                        cohort.courseId
                    ) === String(
                        courseId
                    );

                }
            );


        if(filtered.length){

            list =
                filtered;

        }

    }


    list.forEach(
        cohort => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                cohort.id;


            option.textContent =
                cohort.cohortName ||
                cohort.name ||
                cohort.title ||
                cohort.id;


            select.appendChild(
                option
            );

        }
    );

}


document
.getElementById(
    "courseSelect"
)
.addEventListener(
    "change",
    function(){

        renderCohortOptions(
            this.value
        );

    }
);


/* =========================
   PROJECTS
========================= */

async function loadProjects(){

    const snapshot =
        await db
        .collection("projects")
        .get();


    projects = [];


    snapshot.forEach(
        doc => {

            projects.push({

                id:
                    doc.id,

                ...doc.data()

            });

        }
    );


    updateProjectStats();

    renderProjects();

}


/* =========================
   PROJECT STATS
========================= */

function updateProjectStats(){

    document.getElementById(
        "totalProjects"
    ).textContent =
        projects.length;


    document.getElementById(
        "activeProjects"
    ).textContent =
        projects.filter(
            project =>
                project.status ===
                "active"
        ).length;

}


/* =========================
   RENDER PROJECTS
========================= */

function renderProjects(){

    const container =
        document.getElementById(
            "projectsContainer"
        );


    if(!projects.length){

        container.innerHTML = `
            <div class="empty">
                No projects created yet.
            </div>
        `;

        return;

    }


    let html = `

        <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>
                        Project
                    </th>

                    <th>
                        Course
                    </th>

                    <th>
                        Cohort
                    </th>

                    <th>
                        Total Marks
                    </th>

                    <th>
                        Deadline
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Actions
                    </th>

                </tr>

            </thead>

            <tbody>

    `;


    projects.forEach(
        project => {

            const status =
                project.status ||
                "active";


            html += `

                <tr>

                    <td>
                        ${escapeHtml(
                            project.title ||
                            project.projectTitle ||
                            "Untitled Project"
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            getProjectCourseName(
                                project
                            ) ||
                            "—"
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            project.cohortName ||
                            getCohortNameById(
                                project.cohortId
                            ) ||
                            "All Cohorts"
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            project.totalMarks ||
                            0
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            formatDate(
                                project.deadline
                            )
                        )}
                    </td>


                    <td>

                        <span
                            class="badge ${
                                status === "active"
                                    ? "badge-active"
                                    : "badge-inactive"
                            }"
                        >

                            ${escapeHtml(
                                status
                            )}

                        </span>

                    </td>


                    <td>

                        <button
                            type="button"
                            class="small-btn primary"
                            onclick="viewProjectSubmissions('${project.id}')"
                        >
                            Submissions
                        </button>


                        <button
                            type="button"
                            class="small-btn secondary"
                            onclick="editProject('${project.id}')"
                        >
                            Edit
                        </button>


                        <button
                            type="button"
                            class="small-btn danger"
                            onclick="deleteProject('${project.id}')"
                        >
                            Delete
                        </button>

                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

        </div>

    `;


    container.innerHTML =
        html;

}


function getCohortNameById(id){

    if(!id){

        return "";

    }


    const cohort =
        cohorts.find(
            c => c.id === id
        );


    return cohort
        ? (
            cohort.cohortName ||
            cohort.name ||
            cohort.title ||
            ""
        )
        : "";

}


/* =========================
   STUDENTS
========================= */

async function loadStudents(){

    const snapshot =
        await db
        .collection("users")
        .get();


    students = [];


    snapshot.forEach(
        doc => {

            const data =
                doc.data();


            if(
                data.role === "student" ||
                !data.role
            ){

                students.push({

                    uid:
                        doc.id,

                    studentId:
                        data.studentId ||
                        "",

                    fullName:
                        data.fullName ||
                        data.name ||
                        "Unnamed Student",

                    email:
                        data.email ||
                        "",

                    course:
                        data.course ||
                        "",

                    courseName:
                        data.courseName ||
                        "",

                    cohort:
                        data.cohort ||
                        "",

                    status:
                        data.status ||
                        ""

                });

            }

        }
    );


    document.getElementById(
        "totalStudents"
    ).textContent =
        students.length;


    renderStudents();

}


/* =========================

                    </th>

                    <th>

                    </th>

                    </th>

/* =========================
   CREATE / EDIT PROJECT
========================= */

document
.getElementById(
    "projectForm"
)
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const title =
            document.getElementById(
                "projectTitle"
            )
            .value
            .trim();


        const courseSelect =
            document.getElementById(
                "courseSelect"
            );


        const courseId =
            courseSelect.value;


        const selectedCourse =
            courseSelect.options[
                courseSelect.selectedIndex
            ];


        const courseName =
            selectedCourse
                ? (
                    selectedCourse.dataset
                        .courseName ||
                    selectedCourse.textContent
                )
                : "";


        const cohortSelect =
            document.getElementById(
                "cohortSelect"
            );


        const cohortId =
            cohortSelect.value;


        const cohortName =
            cohortSelect.value
                ? cohortSelect.options[
                    cohortSelect.selectedIndex
                ].textContent
                : "";


        const totalMarks =
            Number(
                document.getElementById(
                    "totalMarks"
                ).value
            );


        const deadline =
            document.getElementById(
                "deadline"
            ).value;


        const status =
            document.getElementById(
                "projectStatus"
            ).value;


        const description =
            document.getElementById(
                "description"
            )
            .value
            .trim();


        const instructions =
            document.getElementById(
                "instructions"
            )
            .value
            .trim();


        if(!title){

            showMessage(
                "Enter a project title.",
                "error"
            );

            return;

        }


        if(!courseId){

            showMessage(
                "Select a course.",
                "error"
            );

            return;

        }


        try{

            const data = {

                title:
                    title,

                projectTitle:
                    title,

                courseId:
                    courseId,

                courseName:
                    courseName,

                cohortId:
                    cohortId || "",

                cohortName:
                    cohortName || "",

                totalMarks:
                    totalMarks,

                deadline:
                    deadline || "",

                description:
                    description,

                instructions:
                    instructions,

                status:
                    status,

                updatedAt:
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp()

            };


            if(editingProjectId){

                await db
                    .collection("projects")
                    .doc(
                        editingProjectId
                    )
                    .update(
                        data
                    );


                showMessage(
                    "Project updated successfully."
                );

            }else{

                data.createdAt =
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp();


                data.createdBy =
                    currentUser.uid;


                await db
                    .collection("projects")
                    .add(
                        data
                    );


                showMessage(
                    "Project created successfully."
                );

            }


            resetProjectForm();

            await loadProjects();


        }catch(error){

            console.error(error);


            showMessage(
                "Unable to save project: " +
                error.message,
                "error"
            );

        }

    }
);


/* =========================
   EDIT PROJECT
========================= */

function editProject(
    projectId
){

    const project =
        projects.find(
            project =>
                project.id ===
                projectId
        );


    if(!project){

        return;

    }


    editingProjectId =
        projectId;


    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit Project";


    document.getElementById(
        "projectTitle"
    ).value =
        project.title ||
        project.projectTitle ||
        "";


    document.getElementById(
        "totalMarks"
    ).value =
        project.totalMarks ||
        100;


    document.getElementById(
        "deadline"
    ).value =
        project.deadline ||
        "";


    document.getElementById(
        "projectStatus"
    ).value =
        project.status ||
        "active";


    document.getElementById(
        "description"
    ).value =
        project.description ||
        "";


    document.getElementById(
        "instructions"
    ).value =
        project.instructions ||
        "";


    const courseSelect =
        document.getElementById(
            "courseSelect"
        );


    let courseValue =
        project.courseId ||
        "";


    if(
        !courseValue &&
        project.courseName
    ){

        const matchingCourse =
            courses.find(
                course => {

                    const name =
                        course.courseName ||
                        course.name ||
                        course.title ||
                        course.course ||
                        "";


                    return name ===
                        project.courseName;

                }
            );


        if(matchingCourse){

            courseValue =
                matchingCourse.courseId ||
                matchingCourse.id;

        }

    }


    courseSelect.value =
        courseValue;


    renderCohortOptions(
        courseValue
    );


    document.getElementById(
        "cohortSelect"
    ).value =
        project.cohortId ||
        "";


    document.getElementById(
        "saveProjectBtn"
    ).textContent =
        "Update Project";


    document.getElementById(
        "cancelEditBtn"
    )
    .classList
    .remove("hidden");


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}

}


/* =========================
   DELETE PROJECT
========================= */

async function deleteProject(
    projectId
){

    const project =
        projects.find(
            project =>
                project.id ===
                projectId
        );


    if(!project){

        return;

    }


    const title =
        project.title ||
        project.projectTitle ||
        "this project";


    const confirmed =
        confirm(
            `Delete "${title}"?\n\nThis will delete the project itself.`
        );


    if(!confirmed){

        return;

    }


    try{

        await db
            .collection("projects")
            .doc(projectId)
            .delete();


        showMessage(
            "Project deleted successfully."
        );


        await loadProjects();


    }catch(error){

        console.error(error);


        showMessage(
            "Unable to delete project: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   VIEW PROJECT SUBMISSIONS
===================================================== */

async function viewProjectSubmissions(
    projectId
){

    const project =
        projects.find(
            project =>
                project.id ===
                projectId
        );


    if(!project){

        return;

    }


    const projectTitle =
        project.title ||
        project.projectTitle ||
        "Project";


    document.getElementById(
        "submissionsTitle"
    ).textContent =
        projectTitle +
        " - Submissions";


    document.getElementById(
        "submissionsModal"
    )
    .classList
    .add("show");


    const container =
        document.getElementById(
            "submissionsContainer"
        );


    container.innerHTML = `
        <div class="loading">
            Loading submissions...
        </div>
    `;


    try{

        const snapshot =
            await db
            .collection(
                "projectSubmissions"
            )
            .where(
                "projectId",
                "==",
                projectId
            )
            .get();


        const submissions =
            snapshot.docs.map(
                doc => ({

                    id:
                        doc.id,

                    ...doc.data()

                })
            );


        if(!submissions.length){

            container.innerHTML = `
                <div class="empty">
                    No students have submitted this project yet.
                </div>
            `;

            return;

        }


        container.innerHTML =
            "";


        submissions.forEach(
            submission => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "submission-card";


                const hasGrade =
                    submission.graded ===
                        true ||
                    (
                        submission.grade !==
                            undefined &&
                        submission.grade !==
                            null
                    );


                const statusText =
                    hasGrade
                        ? "Graded"
                        : (
                            submission.status ||
                            "Submitted"
                        );


                /*
                 * Read the student's actual
                 * answer regardless of which
                 * supported field was used.
                 */
                const studentAnswer =
                    submission.answer ||
                    submission.studentAnswer ||
                    submission.submission ||
                    submission.submissionText ||
                    submission.submissionNote ||
                    "";


                let urlHtml =
                    "";


                if(
                    submission.projectLink
                ){

                    const safeUrl =
                        normalizeUrl(
                            submission.projectLink
                        );


                    urlHtml = `

                        <a
                            class="link-btn"
                            href="${escapeHtml(
                                safeUrl
                            )}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Open Submitted Project
                        </a>

                    `;

                }


                card.innerHTML = `

                    <h3>
                        ${escapeHtml(
                            submission.studentName ||
                            "Unnamed Student"
                        )}
                    </h3>


                    <p>
                        <strong>
                            Student ID:
                        </strong>

                        ${escapeHtml(
                            submission.studentId ||
                            "—"
                        )}
                    </p>


                    <p>
                        <strong>
                            Email:
                        </strong>

                        ${escapeHtml(
                            submission.studentEmail ||
                            "—"
                        )}
                    </p>


                    <p>
                        <strong>
                            Submitted:
                        </strong>

                        ${escapeHtml(
                            formatDate(
                                submission.submittedAt
                            )
                        )}
                    </p>


                    <p>
                        <strong>
                            Status:
                        </strong>

                        ${escapeHtml(
                            statusText
                        )}
                    </p>


                    <!-- STUDENT ANSWER -->

                    <div class="answer-box">

                        <div class="answer-title">
                            Student Answer
                        </div>


                        ${
                            studentAnswer
                                ? `
                                    <div class="answer-content">
                                        ${escapeHtml(
                                            studentAnswer
                                        )}
                                    </div>
                                `
                                : `
                                    <div
                                        style="
                                            color:#777;
                                            font-size:13px;
                                        "
                                    >
                                        No written answer was submitted.
                                    </div>
                                `
                        }

                    </div>


                    ${
                        submission.projectLink
                            ? `
                                <p style="margin-top:12px;">

                                    <strong>
                                        Project URL:
                                    </strong>

                                    ${escapeHtml(
                                        submission.projectLink
                                    )}

                                </p>
                            `
                            : ""
                    }


                    ${
                        hasGrade
                            ? `

                                <div class="grade-summary">

                                    <p>

                                        <strong>
                                            Score:
                                        </strong>

                                        ${escapeHtml(
                                            submission.grade
                                        )}

                                        /

                                        ${escapeHtml(
                                            submission.totalMarks ||
                                            project.totalMarks ||
                                            100
                                        )}

                                    </p>


                                    <p>

                                        <strong>
                                            Percentage:
                                        </strong>

                                        ${escapeHtml(
                                            Number(
                                                submission.percentage ||
                                                0
                                            ).toFixed(1)
                                        )}%

                                    </p>


                                    <p>

                                        <strong>
                                            Result:
                                        </strong>

                                        ${escapeHtml(
                                            submission.gradeStatus ||
                                            "Graded"
                                        )}

                                    </p>


                                    ${
                                        submission.feedback
                                            ? `

                                                <p>

                                                    <strong>
                                                        Feedback:
                                                    </strong>

                                                    ${escapeHtml(
                                                        submission.feedback
                                                    )}

                                                </p>

                                            `
                                            : ""
                                    }

                                </div>

                            `
                            : ""
                    }


                    <div class="submission-actions">

                        ${urlHtml}


                        <button
                            type="button"
                            class="small-btn primary grade-btn"
                        >

                            ${
                                hasGrade
                                    ? "Edit Grade"
                                    : "Grade Project"
                            }

                        </button>

                    </div>

                `;


                /*
                 * IMPORTANT:
                 *
                 * We attach the click event
                 * directly to the button.
                 *
                 * No long inline onclick.
                 */

                const gradeButton =
                    card.querySelector(
                        ".grade-btn"
                    );


                gradeButton.addEventListener(
                    "click",
                    function(){

                        openGradeModal(

                            submission.id,

                            submission.studentName ||
                            "Unnamed Student",

                            projectTitle,

                            submission.grade !==
                                undefined &&
                            submission.grade !==
                                null
                                ? submission.grade
                                : "",

                            submission.feedback ||
                            "",

                            project.totalMarks ||
                            submission.totalMarks ||
                            100

                        );

                    }
                );


                container.appendChild(
                    card
                );

            }
        );


    }catch(error){

        console.error(error);


        container.innerHTML = `

            <div class="empty">

                Unable to load submissions.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}

/* =====================================================
   SAVE GRADE
===================================================== */

document
.getElementById(
    "gradeForm"
)
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const submissionId =
            document.getElementById(
                "gradeSubmissionId"
            ).value;


        const totalMarks =
            Number(
                document.getElementById(
                    "gradeTotalMarks"
                ).value
            );


        const grade =
            Number(
                document.getElementById(
                    "gradeScore"
                ).value
            );


        const feedback =
            document.getElementById(
                "gradeFeedback"
            )
            .value
            .trim();


        if(!submissionId){

            alert(
                "Submission not found."
            );

            return;

        }


        if(
            isNaN(grade) ||
            grade < 0 ||
            grade > totalMarks
        ){

            alert(
                `Score must be between 0 and ${totalMarks}.`
            );

            return;

        }


        const percentage =
            totalMarks > 0
                ? (
                    grade /
                    totalMarks
                ) * 100
                : 0;


        const gradeStatus =
            percentage >= 50
                ? "Passed"
                : "Failed";


        const saveButton =
            document.querySelector(
                "#gradeForm button[type='submit']"
            );


        saveButton.disabled =
            true;


        saveButton.textContent =
            "Saving...";


        try{

            /*
             * Everything needed by
             * results.html and the student's
             * project page is saved here.
             */

            await db
                .collection(
                    "projectSubmissions"
                )
                .doc(
                    submissionId
                )
                .update({

                    grade:
                        grade,

                    totalMarks:
                        totalMarks,

                    percentage:
                        percentage,

                    gradeStatus:
                        gradeStatus,

                    feedback:
                        feedback,

                    graded:
                        true,

                    status:
                        "graded",

                    gradedAt:
                        firebase.firestore
                        .FieldValue
                        .serverTimestamp(),

                    gradedBy:
                        currentUser.uid

                });


            showMessage(
                "Project graded successfully."
            );


            closeGradeModal();


            /*
             * Find currently open project.
             */

            const title =
                document.getElementById(
                    "submissionsTitle"
                ).textContent;


            const project =
                projects.find(
                    project => {

                        const projectTitle =
                            project.title ||
                            project.projectTitle ||
                            "Project";


                        return title ===
                            projectTitle +
                            " - Submissions";

                    }
                );


            if(project){

                await viewProjectSubmissions(
                    project.id
                );

            }


        }catch(error){

            console.error(error);


            showMessage(
                "Unable to save grade: " +
                error.message,
                "error"
            );


        }finally{

            saveButton.disabled =
                false;


            saveButton.textContent =
                "Save Grade";

        }

    }
);
