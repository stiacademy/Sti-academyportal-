<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #050505;
            color: white;

        header {

        }

        .danger {

        }

        .actions {

        }

        }

        .success-message {

        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,

            padding: 12px;
            border-bottom: 1px solid #222;
            text-align: left;
            font-size: 14px;
        }

        th {
            color: #aaa;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
        }

        .present {
            background: #123b23;
            color: #65df91;
        }

        .absent {
            background: #3a1616;
            color: #ff8585;
        }

        .open {
            background: #123653;
            color: #72bfff;
        }

        .closed {
            background: #333;
            color: #aaa;
        }

        .generated {
            background: #382f10;
            color: #ffdb5c;
        }

        .loading {
            color: #aaa;
        }

        .delete-record {
            background: #b42323;
            color: white;
            padding: 8px 11px;
            font-size: 12px;
        }

        .active-session-info {
            margin-top: 12px;

            font-size: 13px;
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            main {
                padding: 14px;
            }

            .attendance-code {
                font-size: 30px;

            }
        }
    </style>
</head>

<body>

    <h1>STI Academy</h1>
    <p>Attendance Management</p>
</header>

<main>

    <div class="card">

        <h2>Create Attendance Session</h2>

        <div class="grid">

            </div>

            <div>

                <select id="classSelect">

            </div>

            <div>

                <select id="tutorSelect">
                    <option value="">Loading tutors...</option>

            </div>

            <div>
                <label>Attendance Date</label>

                <input

                    <option value="20">

        <div class="actions">

                id="generateBtn"

        <div

        <div

        >

            <div

            >
                ------

            <div
                class="timer"

                Attendance not started
            </div>

            <div
                class="actions"
                style="justify-content:center;"
            >

                <button
                    class="success"
                    id="announceBtn"
                >

                </button>

                <button

                </button>

            </div>

    </div>


    <div class="card">

        <h2>Attendance Sessions</h2>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>Date</th>
                        <th>Course</th>
                        <th>Cohort</th>
                        <th>Class</th>
                        <th>Tutor</th>

                <tbody id="sessionsTable">

                    <tr>

                        <td

                        >

                    </tr>

            </table>

        </div>

    </div>

        class="card"
        id="recordsCard"
        style="display:none;"
    >

        <h2 id="recordsTitle">
            Attendance Records

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>Student</th>
                        <th>Student ID</th>
                        <th>Email</th>
                        <th>Submitted</th>

                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="recordsTable">
                </tbody>

            </table>

        </div>

    </div>

</main>


<script>

const firebaseConfig = {
    apiKey: "AIzaSyBHa_irkP8QFgCQjUqTKlqdmv5cf8Ec4hg",
    authDomain: "sti-academy.firebaseapp.com",
    projectId: "sti-academy",
    storageBucket: "sti-academy.firebasestorage.app",
    messagingSenderId: "709840641262",
    appId: "1:709840641262:web:714b09bf661afa159f27ff",
    measurementId: "G-7ZRZ3P28YP"
};


if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}


const auth = firebase.auth();
const db = firebase.firestore();


const courseSelect =
    document.getElementById("courseSelect");

const cohortSelect =
    document.getElementById("cohortSelect");

const classSelect =
    document.getElementById("classSelect");

const tutorSelect =
    document.getElementById("tutorSelect");

const attendanceDate =
    document.getElementById("attendanceDate");

const durationSelect =
    document.getElementById("durationSelect");

const generateBtn =
    document.getElementById("generateBtn");

const announceBtn =
    document.getElementById("announceBtn");

const closeBtn =
    document.getElementById("closeBtn");

const codeBox =
    document.getElementById("codeBox");

const attendanceCode =
    document.getElementById("attendanceCode");

const timer =
    document.getElementById("timer");

const message =
    document.getElementById("message");

const activeSessionInfo =
    document.getElementById("activeSessionInfo");

const sessionsTable =
    document.getElementById("sessionsTable");

const recordsCard =
    document.getElementById("recordsCard");

const recordsTitle =
    document.getElementById("recordsTitle");

const recordsTable =
    document.getElementById("recordsTable");


let courses = [];
let cohorts = [];
let classes = [];
let tutors = [];

let activeSessionId = null;
let activeSessionData = null;

let timerInterval = null;


/* =====================================================
   AUTH
===================================================== */

auth.onAuthStateChanged(async user => {

    if (!user) {

        window.location.href =
            "../index.html";

        return;
    }


    try {

        const userDoc =
            await db
                .collection("users")
                .doc(user.uid)
                .get();


        if (
            !userDoc.exists ||
            userDoc.data().role !== "admin" ||
            userDoc.data().status !== "active"
        ) {

            alert(
                "Admin access required."
            );

            window.location.href =
                "../index.html";

            return;
        }


        setDefaultDate();

        await loadCourses();

        await loadTutors();

        await loadSessions();

        /*
         * IMPORTANT:
         * Restore any currently open attendance
         * session from Firestore after the page loads.
         */
        await restoreOpenSession();


    } catch (error) {

        console.error(error);

        showMessage(
            "Unable to load attendance page.",
            true
        );
    }

});


/* =====================================================
   HELPERS
===================================================== */

function showMessage(
    text,
    isError = false,
    isSuccess = false
) {

    message.textContent = text;


    let className =
        "message info";


    if (isError) {

        className =
            "message error";

    } else if (isSuccess) {

        className =
            "message success-message";
    }


    message.className =
        className;


    message.style.display =
        "block";
}


function hideMessage() {

    message.style.display =
        "none";
}


/* =====================================================
   COURSE NAME NORMALIZATION
===================================================== */

function normalizeCourseName(value) {

    const text =
        String(value || "")
            .trim()
            .replace(/\s+/g, " ");


    if (!text) {
        return "";
    }


    return text
        .toLowerCase()
        .split(" ")
        .map(word => {

            if (!word) {
                return "";
            }

            return (
                word.charAt(0).toUpperCase() +
                word.slice(1)
            );

        })
        .join(" ");
}


/* =====================================================
   DEFAULT DATE
===================================================== */

function setDefaultDate() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    attendanceDate.value =
        `${year}-${month}-${day}`;
}


/* =====================================================
   GENERATE CODE
===================================================== */

function generateCode() {

    return Math.floor(
        100000 +
        Math.random() * 900000
    ).toString();
}


/* =====================================================
   LOAD COURSES
===================================================== */

async function loadCourses() {

    courseSelect.innerHTML =
        '<option value="">Select course</option>';


    const snapshot =
        await db
            .collection("courses")
            .where(
                "status",
                "==",
                "active"
            )
            .get();


    courses = [];


    snapshot.forEach(doc => {

        const data =
            doc.data();


        const originalCourseName =
            data.courseName ||
            doc.id;


        courses.push({

            id: doc.id,

            ...data,

            normalizedCourseName:
                normalizeCourseName(
                    originalCourseName
                )

        });

    });


    courses.sort((a, b) =>
        String(
            a.normalizedCourseName ||
            ""
        ).localeCompare(
            String(
                b.normalizedCourseName ||
                ""
            )
        )
    );


    courses.forEach(course => {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            course.id;


        option.textContent =
            course.normalizedCourseName;


        courseSelect.appendChild(
            option
        );

    });

}


/* =====================================================
   LOAD TUTORS
===================================================== */

async function loadTutors() {

    tutorSelect.innerHTML =
        '<option value="">Select tutor</option>';


    const snapshot =
        await db
            .collection("tutors")
            .where(
                "status",
                "==",
                "active"
            )
            .get();


    tutors = [];


    snapshot.forEach(doc => {

        tutors.push({

            id: doc.id,

            ...doc.data()

        });

    });


    tutors.sort((a, b) =>
        String(
            a.fullName ||
            a.name ||
            ""
        ).localeCompare(
            String(
                b.fullName ||
                b.name ||
                ""
            )
        )
    );


    tutors.forEach(tutor => {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            tutor.id;


        option.textContent =
            tutor.fullName ||
            tutor.name ||
            tutor.email ||
            tutor.id;


        tutorSelect.appendChild(
            option
        );

    });

}


/* =====================================================
   COURSE CHANGE
===================================================== */

courseSelect.addEventListener(
    "change",
    async () => {

        cohortSelect.innerHTML =
            '<option value="">Loading cohorts...</option>';


        classSelect.innerHTML =
            '<option value="">Select cohort first</option>';


        const courseId =
            courseSelect.value;


        if (!courseId) {

            cohortSelect.innerHTML =
                '<option value="">Select course first</option>';

            return;
        }


        await loadCohorts(
            courseId
        );

    }
);


/* =====================================================
   LOAD COHORTS
===================================================== */

async function loadCohorts(
    courseId
) {

    const snapshot =
        await db
            .collection("cohorts")
            .where(
                "courseId",
                "==",
                courseId
            )
            .get();


    cohorts = [];


    snapshot.forEach(doc => {

        cohorts.push({

            id: doc.id,

            ...doc.data()

        });

    });


    cohorts.sort((a, b) =>
        String(
            a.startDate ||
            ""
        ).localeCompare(
            String(
                b.startDate ||
                ""
            )
        )
    );


    cohortSelect.innerHTML =
        '<option value="">Select cohort</option>';


    cohorts.forEach(cohort => {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            cohort.id;


        option.textContent =
            cohort.cohortName;


        cohortSelect.appendChild(
            option
        );

    });

}


/* =====================================================
   COHORT CHANGE
===================================================== */

cohortSelect.addEventListener(
    "change",
    async () => {

        const courseId =
            courseSelect.value;


        const cohortId =
            cohortSelect.value;


        classSelect.innerHTML =
            '<option value="">Loading classes...</option>';


        if (
            !courseId ||
            !cohortId
        ) {

            classSelect.innerHTML =
                '<option value="">Select course and cohort first</option>';

            return;
        }


        await loadClasses(
            courseId,
            cohortId
        );

    }
);


/* =====================================================
   LOAD CLASSES
===================================================== */

async function loadClasses(
    courseId,
    cohortId
) {

    const snapshot =
        await db
            .collection("classes")
            .where(
                "courseId",
                "==",
                courseId
            )
            .where(
                "cohortId",
                "==",
                cohortId
            )
            .get();


    classes = [];


    snapshot.forEach(doc => {

        classes.push({

            id: doc.id,

            ...doc.data()

        });

    });


    classes.sort((a, b) =>
        String(
            b.classDate ||
            ""
        ).localeCompare(
            String(
                a.classDate ||
                ""
            )
        )
    );


    classSelect.innerHTML =
        '<option value="">Select class</option>';


    classes.forEach(item => {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            item.id;


        option.textContent =
            `${item.classTitle || "Class"} - ${item.classDate || ""}`;


        classSelect.appendChild(
            option
        );

    });

}


/* =====================================================
   GENERATE ATTENDANCE SESSION
===================================================== */

generateBtn.addEventListener(
    "click",
    async () => {

        hideMessage();


        const courseId =
            courseSelect.value;


        const cohortId =
            cohortSelect.value;


        const classId =
            classSelect.value;


        const tutorId =
            tutorSelect.value;


        const date =
            attendanceDate.value;


        const duration =
            Number(
                durationSelect.value
            );


        if (
            !courseId ||
            !cohortId ||
            !classId ||
            !tutorId ||
            !date
        ) {

            showMessage(
                "Please complete all attendance fields.",
                true
            );

            return;
        }


        const course =
            courses.find(
                item =>
                    item.id ===
                    courseId
            );


        const cohort =
            cohorts.find(
                item =>
                    item.id ===
                    cohortId
            );


        const classItem =
            classes.find(
                item =>
                    item.id ===
                    classId
            );


        const tutor =
            tutors.find(
                item =>
                    item.id ===
                    tutorId
            );


        if (
            !course ||
            !cohort ||
            !classItem ||
            !tutor
        ) {

            showMessage(
                "Unable to find selected records.",
                true
            );

            return;
        }


        try {

            generateBtn.disabled =
                true;


            const code =
                generateCode();


            const cleanCourseName =
                normalizeCourseName(
                    course.courseName ||
                    course.id
                );


            const session = {

                courseId,

                courseName:
                    cleanCourseName,

                department:
                    course.department ||
                    "",

                cohortId,

                cohortName:
                    cohort.cohortName,

                classId,

                classTitle:
                    classItem.classTitle ||
                    "",

                tutorId,

                tutorName:
                    tutor.fullName ||
                    tutor.name ||
                    tutor.email ||
                    "",

                attendanceDate:
                    date,

                code,

                durationMinutes:
                    duration,

                status:
                    "generated",

                announcedAt:
                    null,

                openedAt:
                    null,

                expiresAt:
                    null,

                closedAt:
                    null,

                createdAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp(),

                createdBy:
                    auth.currentUser.uid

            };


            const docRef =
                await db
                    .collection(
                        "attendanceSessions"
                    )
                    .add(
                        session
                    );


            activeSessionId =
                docRef.id;

            activeSessionData =
                {
                    id: docRef.id,
                    ...session
                };


            attendanceCode.textContent =
                code;


            codeBox.style.display =
                "block";


            announceBtn.disabled =
                false;


            closeBtn.disabled =
                true;


            timer.textContent =
                "Code generated. Click CODE ANNOUNCED when you have sent it to the tutor.";


            activeSessionInfo.textContent =
                `Session: ${cleanCourseName} • ${cohort.cohortName} • ${classItem.classTitle || "Class"}`;

            activeSessionInfo.style.display =
                "block";


            await loadSessions();


            showMessage(
                "Attendance code generated successfully.",
                false,
                true
            );


        } catch (error) {

            console.error(error);


            showMessage(
                "Failed to generate attendance code.",
                true
            );


        } finally {

            generateBtn.disabled =
                false;

        }

    }
);


/* =====================================================
   ANNOUNCE CODE
===================================================== */

announceBtn.addEventListener(
    "click",
    async () => {

        if (!activeSessionId) {
            return;
        }


        try {

            const sessionRef =
                db
                    .collection(
                        "attendanceSessions"
                    )
                    .doc(
                        activeSessionId
                    );


            /*
             * Read the session from Firestore first.
             * This prevents the browser from using an
             * incorrect duration after a page reload.
             */
            const sessionSnap =
                await sessionRef.get();


            if (!sessionSnap.exists) {

                throw new Error(
                    "Attendance session no longer exists."
                );
            }


            const session =
                sessionSnap.data();


            const duration =
                Number(
                    session.durationMinutes ||
                    durationSelect.value ||
                    30
                );


            const now =
                new Date();


            const sessionEndTime =
                new Date(
                    now.getTime() +
                    duration *
                    60 *
                    1000
                );


            await sessionRef.update({

                status:
                    "open",

                announcedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp(),

                openedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp(),

                expiresAt:
                    firebase.firestore
                        .Timestamp
                        .fromDate(
                            sessionEndTime
                        )

            });


            activeSessionData = {

                id:
                    activeSessionId,

                ...session,

                status:
                    "open",

                expiresAt:
                    firebase.firestore
                        .Timestamp
                        .fromDate(
                            sessionEndTime
                        )

            };


            announceBtn.disabled =
                true;


            closeBtn.disabled =
                false;


            codeBox.style.display =
                "block";


            attendanceCode.textContent =
                session.code ||
                "------";


            activeSessionInfo.textContent =
                `OPEN • ${session.courseName || ""} • ${session.cohortName || ""} • ${session.classTitle || "Class"}`;

            activeSessionInfo.style.display =
                "block";


            startTimerFromTimestamp(
                activeSessionData.expiresAt
            );


            showMessage(
                "Attendance is now open. Students can submit the code.",
                false,
                true
            );


            await loadSessions();


        } catch (error) {

            console.error(error);


            showMessage(
                "Failed to open attendance: " +
                error.message,
                true
            );

        }

    }
);


/* =====================================================
   RESTORE OPEN SESSION
===================================================== */

async function restoreOpenSession() {

    try {

        /*
         * Get recent sessions and find an OPEN one.
         * We do this locally so we can avoid depending
         * on a compound Firestore index.
         */
        const snapshot =
            await db
                .collection(
                    "attendanceSessions"
                )
                .orderBy(
                    "createdAt",
                    "desc"
                )
                .limit(100)
                .get();


        let openSession = null;


        snapshot.forEach(doc => {

            if (
                openSession
            ) {
                return;
            }


            const data =
                doc.data();


            if (
                data.status ===
                "open"
            ) {

                openSession = {

                    id:
                        doc.id,

                    ...data

                };

            }

        });


        if (!openSession) {

            resetActiveSessionUI();

            return;
        }


        if (!openSession.expiresAt) {

            resetActiveSessionUI();

            return;
        }


        const expiryDate =
            openSession.expiresAt.toDate
                ? openSession.expiresAt.toDate()
                : new Date(
                    openSession.expiresAt
                );


        /*
         * If the saved session has already expired,
         * don't pretend it is active.
         *
         * We do NOT automatically close it here.
         * The admin can still complete it manually.
         */
        if (
            expiryDate.getTime() <=
            Date.now()
        ) {

            activeSessionId =
                openSession.id;

            activeSessionData =
                openSession;


            showRestoredSession(
                openSession,
                true
            );


            return;
        }


        activeSessionId =
            openSession.id;


        activeSessionData =
            openSession;


        showRestoredSession(
            openSession,
            false
        );


    } catch (error) {

        console.error(
            "Restore open session error:",
            error
        );

    }

}


/* =====================================================
   SHOW RESTORED SESSION
===================================================== */

function showRestoredSession(
    session,
    expired
) {

    codeBox.style.display =
        "block";


    attendanceCode.textContent =
        session.code ||
        "------";


    activeSessionInfo.textContent =
        `${expired ? "EXPIRED" : "OPEN"} • ${session.courseName || ""} • ${session.cohortName || ""} • ${session.classTitle || "Class"}`;

    activeSessionInfo.style.display =
        "block";


    announceBtn.disabled =
        true;


    closeBtn.disabled =
        false;


    /*
     * If the session is still active,
     * calculate the timer from the Firestore
     * expiresAt timestamp.
     */
    if (!expired) {

        startTimerFromTimestamp(
            session.expiresAt
        );

    } else {

        clearInterval(
            timerInterval
        );


        timer.textContent =
            "Attendance window expired. Click Complete Attendance to finalize.";

    }

}


/* =====================================================
   TIMER FROM FIRESTORE TIMESTAMP
===================================================== */

function startTimerFromTimestamp(
    timestamp
) {

    clearInterval(
        timerInterval
    );


    let expiryDate;


    try {

        expiryDate =
            timestamp.toDate
                ? timestamp.toDate()
                : new Date(
                    timestamp
                );

    } catch {

        timer.textContent =
            "Unable to read attendance expiry time.";

        return;
    }


    function updateSavedTimer() {

        const remaining =
            expiryDate.getTime() -
            Date.now();


        if (remaining <= 0) {

            clearInterval(
                timerInterval
            );


            timer.textContent =
                "Attendance window expired. Click Complete Attendance to finalize.";


            closeBtn.disabled =
                false;

            return;
        }


        const totalSeconds =
            Math.floor(
                remaining /
                1000
            );


        const minutes =
            Math.floor(
                totalSeconds /
                60
            );


        const seconds =
            totalSeconds %
            60;


        timer.textContent =
            `Attendance open: ${minutes}:${String(seconds).padStart(2, "0")} remaining`;

    }


    updateSavedTimer();


    timerInterval =
        setInterval(
            updateSavedTimer,
            1000
        );

}


/* =====================================================
   RESET ACTIVE SESSION UI
===================================================== */

function resetActiveSessionUI() {

    activeSessionId =
        null;

    activeSessionData =
        null;


    clearInterval(
        timerInterval
    );


    codeBox.style.display =
        "none";


    activeSessionInfo.style.display =
        "none";


    announceBtn.disabled =
        true;


    closeBtn.disabled =
        true;


    timer.textContent =
        "Attendance not started";

}


/* =====================================================
   FINALIZE ATTENDANCE
===================================================== */

async function finalizeAttendance(
    sessionId
) {

    const sessionRef =
        db
            .collection(
                "attendanceSessions"
            )
            .doc(
                sessionId
            );


    const sessionSnap =
        await sessionRef.get();


    if (!sessionSnap.exists) {

        throw new Error(
            "Attendance session no longer exists."
        );
    }


    const session =
        sessionSnap.data();


    if (
        session.status ===
        "closed"
    ) {

        return 0;
    }


    const studentsSnapshot =
        await db
            .collection("students")
            .where(
                "status",
                "==",
                "active"
            )
            .get();


    const expectedStudents = [];


    const sessionCourse =
        normalizeCourseName(
            session.courseName
        );


    const sessionCohort =
        String(
            session.cohortName ||
            ""
        )
            .trim()
            .toLowerCase();


    studentsSnapshot.forEach(doc => {

        const student =
            doc.data();


        const studentCourse =
            normalizeCourseName(
                student.course ||
                student.courseName ||
                ""
            );


        const studentCohort =
            String(
                student.cohort ||
                student.cohortName ||
                ""
            )
                .trim()
                .toLowerCase();


        const courseMatches =
            studentCourse ===
            sessionCourse;


        const cohortMatches =
            studentCohort ===
            sessionCohort;


        if (
            courseMatches &&
            cohortMatches &&
            student.studentId
        ) {

            expectedStudents.push({

                documentId:
                    doc.id,

                ...student

            });

        }

    });


    const existingRecordsSnapshot =
        await db
            .collection(
                "attendanceRecords"
            )
            .where(
                "sessionId",
                "==",
                sessionId
            )
            .get();


    const existingRecords =
        new Map();


    existingRecordsSnapshot.forEach(doc => {

        const data =
            doc.data();


        if (
            data.studentId
        ) {

            existingRecords.set(
                String(
                    data.studentId
                ),
                {
                    id: doc.id,
                    ...data
                }
            );

        }

    });


    const chunkSize =
        450;


    for (
        let start = 0;
        start < expectedStudents.length;
        start += chunkSize
    ) {

        const batch =
            db.batch();


        const chunk =
            expectedStudents.slice(
                start,
                start + chunkSize
            );


        let writes =
            0;


        chunk.forEach(student => {

            const studentId =
                String(
                    student.studentId
                );


            if (
                existingRecords.has(
                    studentId
                )
            ) {

                return;
            }


            const recordId =
                `${sessionId}_${studentId}`;


            const recordRef =
                db
                    .collection(
                        "attendanceRecords"
                    )
                    .doc(
                        recordId
                    );


            batch.set(
                recordRef,
                {

                    sessionId,

                    studentUid:
                        student.uid ||
                        "",

                    studentId,

                    studentName:
                        student.fullName ||
                        student.name ||
                        "",

                    email:
                        student.email ||
                        "",

                    courseId:
                        session.courseId ||
                        "",

                    courseName:
                        session.courseName ||
                        "",

                    department:
                        session.department ||
                        student.department ||
                        "",

                    cohortId:
                        session.cohortId ||
                        "",

                    cohortName:
                        session.cohortName ||
                        "",

                    classId:
                        session.classId ||
                        "",

                    classTitle:
                        session.classTitle ||
                        "",

                    attendanceDate:
                        session.attendanceDate ||
                        "",

                    status:
                        "absent",

                    submittedAt:
                        null,

                    createdAt:
                        firebase.firestore
                            .FieldValue
                            .serverTimestamp(),

                    createdBy:
                        auth.currentUser.uid

                }
            );


            writes++;

        });


        if (
            writes > 0
        ) {

            await batch.commit();

        }

    }


    await sessionRef.update({

        status:
            "closed",

        closedAt:
            firebase.firestore
                .FieldValue
                .serverTimestamp(),

        finalizedAt:
            firebase.firestore
                .FieldValue
                .serverTimestamp(),

        finalizedBy:
            auth.currentUser.uid,

        expectedStudentCount:
            expectedStudents.length

    });


    return expectedStudents.length;
}


/* =====================================================
   COMPLETE ATTENDANCE
===================================================== */

closeBtn.addEventListener(
    "click",
    async () => {

        if (!activeSessionId) {

            showMessage(
                "There is no active attendance session to complete.",
                true
            );

            return;
        }


        const confirmed =
            confirm(
                "Complete this attendance session?\n\n" +
                "Students who submitted the code will be marked Present.\n" +
                "Students who did not submit will be marked Absent."
            );


        if (!confirmed) {
            return;
        }


        try {

            closeBtn.disabled =
                true;


            clearInterval(
                timerInterval
            );


            timer.textContent =
                "Finalizing attendance...";


            const sessionIdToComplete =
                activeSessionId;


            const totalStudents =
                await finalizeAttendance(
                    sessionIdToComplete
                );


            announceBtn.disabled =
                true;


            timer.textContent =
                "Attendance completed.";


            activeSessionData =
                null;


            showMessage(
                `Attendance completed successfully. ${totalStudents} expected student(s) processed.`,
                false,
                true
            );


            await loadSessions();


            await viewAttendanceRecords(
                sessionIdToComplete,
                "Attendance"
            );


            /*
             * Keep the completed session's code visible
             * but remove its active-session controls.
             */
            activeSessionId =
                null;


            announceBtn.disabled =
                true;


            closeBtn.disabled =
                true;


        } catch (error) {

            console.error(
                "Finalize attendance error:",
                error
            );


            closeBtn.disabled =
                false;


            showMessage(
                "Unable to complete attendance: " +
                error.message,
                true
            );

        }

    }
);


/* =====================================================
   LOAD SESSIONS
===================================================== */

async function loadSessions() {

    sessionsTable.innerHTML =
        `<tr>
            <td
                colspan="8"
                class="loading"
            >
                Loading attendance sessions...
            </td>
        </tr>`;


    try {

        const snapshot =
            await db
                .collection(
                    "attendanceSessions"
                )
                .orderBy(
                    "createdAt",
                    "desc"
                )
                .limit(100)
                .get();


        if (snapshot.empty) {

            sessionsTable.innerHTML =
                `<tr>
                    <td colspan="8">
                        No attendance sessions yet.
                    </td>
                </tr>`;

            return;
        }


        sessionsTable.innerHTML =
            "";


        snapshot.forEach(doc => {

            const data =
                doc.data();


            const row =
                document.createElement(
                    "tr"
                );


            const status =
                data.status ||
                "generated";


            let statusClass =
                "closed";


            if (
                status ===
                "open"
            ) {

                statusClass =
                    "open";

            } else if (
                status ===
                "generated"
            ) {

                statusClass =
                    "generated";
            }


            const displayCourseName =
                normalizeCourseName(
                    data.courseName ||
                    "-"
                );


            row.innerHTML = `

                <td>
                    ${escapeHtml(
                        data.attendanceDate ||
                        "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        displayCourseName
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        data.cohortName ||
                        "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        data.classTitle ||
                        "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        data.tutorName ||
                        "-"
                    )}
                </td>

                <td>
                    <strong>
                        ${escapeHtml(
                            data.code ||
                            "-"
                        )}
                    </strong>
                </td>

                <td>

                    <span class="badge ${statusClass}">
                        ${escapeHtml(
                            status
                        )}
                    </span>

                </td>

                <td>

                    <button
                        class="secondary"
                        onclick="viewAttendanceRecords(
                            '${escapeAttribute(
                                doc.id
                            )}',
                            '${escapeAttribute(
                                data.classTitle ||
                                "Attendance"
                            )}'
                        )"
                    >
                        View
                    </button>

                </td>

            `;


            sessionsTable.appendChild(
                row
            );

        });


    } catch (error) {

        console.error(error);


        sessionsTable.innerHTML =
            `<tr>
                <td colspan="8">
                    Unable to load attendance sessions.
                </td>
            </tr>`;

    }

}


/* =====================================================
   VIEW ATTENDANCE RECORDS
===================================================== */

window.viewAttendanceRecords =
    async function (
        sessionId,
        title
    ) {

        recordsCard.style.display =
            "block";


        recordsTitle.textContent =
            `Attendance Records - ${title}`;


        recordsTable.innerHTML =
            `<tr>
                <td colspan="6">
                    Loading records...
                </td>
            </tr>`;


        try {

            const snapshot =
                await db
                    .collection(
                        "attendanceRecords"
                    )
                    .where(
                        "sessionId",
                        "==",
                        sessionId
                    )
                    .get();


            if (snapshot.empty) {

                recordsTable.innerHTML =
                    `<tr>
                        <td colspan="6">
                            No attendance records yet.
                        </td>
                    </tr>`;

                return;
            }


            recordsTable.innerHTML =
                "";


            const records = [];


            snapshot.forEach(doc => {

                records.push({

                    id: doc.id,

                    ...doc.data()

                });

            });


            records.sort((a, b) => {

                if (
                    a.status ===
                    "present" &&
                    b.status !==
                    "present"
                ) {

                    return -1;
                }


                if (
                    a.status !==
                    "present" &&
                    b.status ===
                    "present"
                ) {

                    return 1;
                }


                return String(
                    a.studentName ||
                    ""
                ).localeCompare(
                    String(
                        b.studentName ||
                        ""
                    )
                );

            });


            records.forEach(data => {

                const row =
                    document.createElement(
                        "tr"
                    );


                const status =
                    String(
                        data.status ||
                        "absent"
                    ).toLowerCase();


                row.innerHTML = `

                    <td>
                        ${escapeHtml(
                            data.studentName ||
                            data.fullName ||
                            "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            data.studentId ||
                            "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            data.email ||
                            "-"
                        )}
                    </td>

                    <td>
                        ${
                            status ===
                            "present"
                                ? formatTimestamp(
                                    data.submittedAt
                                  )
                                : "-"
                        }
                    </td>

                    <td>

                        <span class="badge ${
                            status ===
                            "present"
                                ? "present"
                                : "absent"
                        }">

                            ${escapeHtml(
                                status
                            )}

                        </span>

                    </td>

                    <td>

                        <button
                            type="button"
                            class="delete-record"
                            onclick="deleteAttendanceRecord(
                                '${escapeAttribute(
                                    data.id
                                )}',
                                '${escapeAttribute(
                                    title
                                )}',
                                '${escapeAttribute(
                                    sessionId
                                )}'
                            )"
                        >
                            Delete
                        </button>

                    </td>

                `;


                recordsTable.appendChild(
                    row
                );

            });


            recordsCard.scrollIntoView({
                behavior: "smooth"
            });


        } catch (error) {

            console.error(error);


            recordsTable.innerHTML =
                `<tr>
                    <td colspan="6">
                        Unable to load attendance records.
                    </td>
                </tr>`;

        }

    };


/* =====================================================
   DELETE ATTENDANCE RECORD
===================================================== */

window.deleteAttendanceRecord =
    async function (
        recordId,
        title,
        sessionId
    ) {

        if (!recordId) {

            alert(
                "Attendance record ID is missing."
            );

            return;
        }


        const confirmed =
            confirm(
                "Are you sure you want to delete this attendance record?\n\n" +
                "This action cannot be undone."
            );


        if (!confirmed) {
            return;
        }


        try {

            const recordRef =
                db
                    .collection(
                        "attendanceRecords"
                    )
                    .doc(
                        recordId
                    );


            const recordSnap =
                await recordRef.get();


            if (!recordSnap.exists) {

                alert(
                    "This attendance record no longer exists."
                );

                return;
            }


            await recordRef.delete();


            alert(
                "Attendance record deleted successfully."
            );


            await viewAttendanceRecords(
                sessionId,
                title
            );


        } catch (error) {

            console.error(
                "Delete attendance error:",
                error
            );


            alert(
                "Unable to delete attendance record.\n\n" +
                error.message
            );

        }

    };


/* =====================================================
   FORMAT TIMESTAMP
===================================================== */

function formatTimestamp(
    timestamp
) {

    if (!timestamp) {
        return "-";
    }


    try {

        const date =
            timestamp.toDate
                ? timestamp.toDate()
                : new Date(
                    timestamp
                );


        return date.toLocaleString(
            "en-NG",
            {
                dateStyle: "medium",
                timeStyle: "short"
            }
        );


    } catch {

        return "-";

    }

}


/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHtml(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
) {

    return String(value)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}


/* =====================================================
   INITIAL BUTTON STATE
===================================================== */

announceBtn.disabled =
    true;

closeBtn.disabled =
    true;

</script>
