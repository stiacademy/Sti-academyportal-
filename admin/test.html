<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tests | STI Academy</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .topbar {
            background: #050505;
            color: white;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
        }

        .brand span {
            color: #1683ff;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .container {
            width: min(1200px, 94%);
            margin: 25px auto 50px;
        }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
        }

        .page-heading h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .page-heading p {
            color: #6b7280;
            font-size: 14px;
        }

        .primary-btn {
            border: none;
            background: #1683ff;
            color: white;
            padding: 12px 18px;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .primary-btn:hover {
            background: #056edb;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 22px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px;
        }

        .stat-card small {
            color: #6b7280;
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .stat-card strong {
            font-size: 25px;
        }

        .toolbar {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 15px;
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        .toolbar input,
        .toolbar select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        .toolbar input:focus,
        .toolbar select:focus {
            border-color: #1683ff;
        }

        .tests-container {
            display: grid;
            gap: 14px;
        }

        .test-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 13px;
            padding: 19px;
        }

        .test-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .test-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .test-meta {
            color: #6b7280;
            font-size: 13px;
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-published {
            background: #dcfce7;
            color: #166534;
        }

        .status-draft {
            background: #fef3c7;
            color: #92400e;
        }

        .status-closed {
            background: #fee2e2;
            color: #991b1b;
        }

        .test-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 18px 0;
        }

        .info-box {
            background: #f8fafc;
            border-radius: 9px;
            padding: 12px;
        }

        .info-box small {
            display: block;
            color: #6b7280;
            margin-bottom: 5px;
            font-size: 11px;
        }

        .info-box strong {
            font-size: 14px;
        }

        .test-actions {
            border-top: 1px solid #eef0f3;
            padding-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
        }

        .action-btn {
            border: 1px solid #d1d5db;
            background: white;
            color: #111827;
            padding: 9px 12px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .action-btn:hover {
            border-color: #1683ff;
            color: #1683ff;
        }

        .submission-btn {
            color: #1683ff;
            border-color: #bfdbfe;
            background: #eff6ff;
        }

        .loading,
        .empty,
        .error {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 35px 20px;
            text-align: center;
            color: #6b7280;
        }

        .error {
            color: #b91c1c;
        }

        @media (max-width: 850px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .toolbar {
                grid-template-columns: 1fr;
            }

            .test-info {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .page-heading {
                align-items: flex-start;
                flex-direction: column;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .test-top {
                flex-direction: column;
            }

            .test-info {
                grid-template-columns: 1fr 1fr;
            }

            .primary-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="brand">
            STI <span>Academy</span>
        </div>

        <a
            href="admin-dashboard.html"
            class="back-btn"
        >
            ← Dashboard
        </a>
    </header>

    <main class="container">

        <section class="page-heading">

            <div>
                <h1>Tests</h1>

                <p>
                    Create, manage and monitor student tests.
                </p>
            </div>

            <a
                href="new-test.html"
                class="primary-btn"
            >
                + Create Test
            </a>

        </section>

        <section class="stats">

            <div class="stat-card">
                <small>Total Tests</small>
                <strong id="totalTests">0</strong>
            </div>

            <div class="stat-card">
                <small>Published</small>
                <strong id="publishedTests">0</strong>
            </div>

            <div class="stat-card">
                <small>Drafts</small>
                <strong id="draftTests">0</strong>
            </div>

            <div class="stat-card">
                <small>Submissions</small>
                <strong id="totalSubmissions">0</strong>
            </div>

        </section>

        <section class="toolbar">

            <input
                type="search"
                id="searchInput"
                placeholder="Search tests..."
            >

            <select id="courseFilter">
                <option value="all">All Courses</option>
            </select>

            <select id="statusFilter">
                <option value="all">All Statuses</option>
                <option value="published">Published</option>
                <option value="draft">Draft</option>
                <option value="closed">Closed</option>
            </select>

        </section>

        <section id="testsContainer" class="tests-container">

            <div class="loading">
                Loading tests...
            </div>

        </section>

    </main>

    <script>

        const firebaseConfig = {
            apiKey:
                "AIzaSyBHa_irkP8QFgCQjUqTKlqdmv5cf8Ec4hg",
            authDomain:
                "sti-academy.firebaseapp.com",
            projectId:
                "sti-academy",
            storageBucket:
                "sti-academy.firebasestorage.app",
            messagingSenderId:
                "709840261642",
            appId:
                "1:709840261642:web:714b09bf661afa159f27ff",
            measurementId:
                "G-7ZRZ3P28YP"
        };

        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const db = firebase.firestore();

        let allTests = [];
        let allSubmissions = [];
        let courses = [];

        const testsContainer =
            document.getElementById("testsContainer");

        const searchInput =
            document.getElementById("searchInput");

        const courseFilter =
            document.getElementById("courseFilter");

        const statusFilter =
            document.getElementById("statusFilter");


        auth.onAuthStateChanged(async (user) => {

            if (!user) {
                window.location.href = "login.html";
                return;
            }

            try {

                const userDoc =
                    await db.collection("users")
                    .doc(user.uid)
                    .get();

                if (!userDoc.exists) {
                    showError("User account was not found.");
                    return;
                }

                const userData = userDoc.data();

                if (
                    userData.role !== "admin" ||
                    userData.status !== "active"
                ) {
                    showError("Access denied. Admin access required.");
                    return;
                }

                await loadData();

            } catch (error) {

                console.error(error);

                showError(
                    "Unable to load the test dashboard."
                );

            }

        });


        async function loadData() {

            const [
                testsSnapshot,
                submissionsSnapshot,
                coursesSnapshot
            ] = await Promise.all([

                db.collection("tests").get(),

                db.collection("testSubmissions").get(),

                db.collection("courses").get()

            ]);

            allTests = [];

            testsSnapshot.forEach(doc => {

                allTests.push({
                    id: doc.id,
                    ...doc.data()
                });

            });

            allSubmissions = [];

            submissionsSnapshot.forEach(doc => {

                allSubmissions.push({
                    id: doc.id,
                    ...doc.data()
                });

            });

            courses = [];

            coursesSnapshot.forEach(doc => {

                courses.push({
                    id: doc.id,
                    ...doc.data()
                });

            });

            allTests.sort((a, b) => {

                const aDate =
                    getDateValue(a.createdAt);

                const bDate =
                    getDateValue(b.createdAt);

                return bDate - aDate;

            });

            populateCourseFilter();

            updateStats();

            renderTests();

        }


        function populateCourseFilter() {

            const courseNames = new Set();

            courses.forEach(course => {

                const name =
                    course.name ||
                    course.title ||
                    course.courseName;

                if (name) {
                    courseNames.add(name);
                }

            });

            allTests.forEach(test => {

                if (test.course) {
                    courseNames.add(test.course);
                }

            });

            [...courseNames]
                .sort()
                .forEach(courseName => {

                    const option =
                        document.createElement("option");

                    option.value = courseName;
                    option.textContent = courseName;

                    courseFilter.appendChild(option);

                });

        }


        function updateStats() {

            const total =
                allTests.length;

            const published =
                allTests.filter(test =>
                    normalizeStatus(test.status) === "published"
                ).length;

            const drafts =
                allTests.filter(test =>
                    normalizeStatus(test.status) === "draft"
                ).length;

            document.getElementById("totalTests")
                .textContent = total;

            document.getElementById("publishedTests")
                .textContent = published;

            document.getElementById("draftTests")
                .textContent = drafts;

            document.getElementById("totalSubmissions")
                .textContent =
                allSubmissions.length;

        }


        function renderTests() {

            const search =
                searchInput.value
                    .trim()
                    .toLowerCase();

            const selectedCourse =
                courseFilter.value;

            const selectedStatus =
                statusFilter.value;

            const filtered =
                allTests.filter(test => {

                    const title =
                        String(
                            test.title ||
                            test.testTitle ||
                            ""
                        ).toLowerCase();

                    const description =
                        String(
                            test.description ||
                            test.instructions ||
                            ""
                        ).toLowerCase();

                    const course =
                        String(
                            test.course ||
                            ""
                        );

                    const status =
                        normalizeStatus(test.status);

                    const matchesSearch =
                        !search ||
                        title.includes(search) ||
                        description.includes(search) ||
                        course.toLowerCase()
                            .includes(search);

                    const matchesCourse =
                        selectedCourse === "all" ||
                        course === selectedCourse;

                    const matchesStatus =
                        selectedStatus === "all" ||
                        status === selectedStatus;

                    return (
                        matchesSearch &&
                        matchesCourse &&
                        matchesStatus
                    );

                });

            if (!filtered.length) {

                testsContainer.innerHTML = `
                    <div class="empty">
                        No tests found.
                    </div>
                `;

                return;

            }

            testsContainer.innerHTML =
                filtered.map(test =>
                    createTestCard(test)
                ).join("");

        }


        function createTestCard(test) {

            const title =
                escapeHtml(
                    test.title ||
                    test.testTitle ||
                    "Untitled Test"
                );

            const course =
                escapeHtml(
                    test.course ||
                    "Course not specified"
                );

            const status =
                normalizeStatus(test.status);

            const statusLabel =
                status.charAt(0).toUpperCase() +
                status.slice(1);

            const statusClass =
                status === "published"
                    ? "status-published"
                    : status === "closed"
                        ? "status-closed"
                        : "status-draft";

            const questionCount =
                Number(
                    test.questionCount ||
                    test.totalQuestions ||
                    0
                );

            const totalMarks =
                Number(
                    test.totalMarks ||
                    test.maxMarks ||
                    0
                );

            const duration =
                test.duration ||
                test.durationMinutes ||
                0;

            const deadline =
                formatDate(
                    test.deadline ||
                    test.dueDate
                );

            const submissions =
                getTestSubmissions(test.id);

            const uniqueSubmitted =
                getUniqueSubmittedCount(
                    submissions
                );

            const expected =
                Number(
                    test.expectedStudents ||
                    test.expectedStudentCount ||
                    0
                );

            const submissionDisplay =
                expected > 0
                    ? `${uniqueSubmitted} / ${expected}`
                    : `${uniqueSubmitted}`;

            return `
                <article class="test-card">

                    <div class="test-top">

                        <div>

                            <div class="test-title">
                                ${title}
                            </div>

                            <div class="test-meta">
                                Course: ${course}
                            </div>

                        </div>

                        <span class="status ${statusClass}">
                            ${statusLabel}
                        </span>

                    </div>

                    <div class="test-info">

                        <div class="info-box">
                            <small>Questions</small>
                            <strong>
                                ${questionCount}
                            </strong>
                        </div>

                        <div class="info-box">
                            <small>Total Marks</small>
                            <strong>
                                ${totalMarks}
                            </strong>
                        </div>

                        <div class="info-box">
                            <small>Duration</small>
                            <strong>
                                ${duration
                                    ? `${duration} mins`
                                    : "Not set"}
                            </strong>
                        </div>

                        <div class="info-box">
                            <small>Deadline</small>
                            <strong>
                                ${deadline}
                            </strong>
                        </div>

                    </div>

                    <div class="test-actions">

                        <a
                            href="new-test.html?id=${encodeURIComponent(test.id)}"
                            class="action-btn"
                        >
                            Edit
                        </a>

                        <a
                            href="test-questions.html?testId=${encodeURIComponent(test.id)}"
                            class="action-btn"
                        >
                            Questions
                        </a>

                        <a
                            href="test-submissions.html?testId=${encodeURIComponent(test.id)}"
                            class="action-btn submission-btn"
                        >
                            Submissions:
                            ${submissionDisplay}
                            →
                        </a>

                    </div>

                </article>
            `;

        }


        function getTestSubmissions(testId) {

            return allSubmissions.filter(
                submission =>
                    submission.testId === testId
            );

        }


        function getUniqueSubmittedCount(submissions) {

            const uniqueStudents =
                new Set();

            submissions.forEach(submission => {

                const key =
                    submission.studentUid ||
                    submission.studentId ||
                    submission.email ||
                    submission.id;

                uniqueStudents.add(key);

            });

            return uniqueStudents.size;

        }


        function normalizeStatus(status) {

            const value =
                String(status || "draft")
                    .toLowerCase()
                    .trim();

            if (
                value === "published" ||
                value === "active"
            ) {
                return "published";
            }

            if (
                value === "closed" ||
                value === "completed"
            ) {
                return "closed";
            }

            return "draft";

        }


        function getDateValue(value) {

            if (!value) {
                return 0;
            }

            if (
                value &&
                typeof value.toDate === "function"
            ) {
                return value.toDate().getTime();
            }

            const date =
                new Date(value);

            return isNaN(date.getTime())
                ? 0
                : date.getTime();

        }


        function formatDate(value) {

            const timestamp =
                getDateValue(value);

            if (!timestamp) {
                return "Not set";
            }

            return new Date(timestamp)
                .toLocaleString(
                    "en-NG",
                    {
                        day: "2-digit",
                        month: "short",
                        year: "numeric",
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

        }


        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        function showError(message) {

            testsContainer.innerHTML = `
                <div class="error">
                    ${escapeHtml(message)}
                </div>
            `;

        }


        searchInput.addEventListener(
            "input",
            renderTests
        );

        courseFilter.addEventListener(
            "change",
            renderTests
        );

        statusFilter.addEventListener(
            "change",
            renderTests
        );

    </script>

</body>

</html>
