<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Courses | STI Academy Admin</title>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #050505;
            color: #ffffff;
        }

        header {
            background: #080808;
            border-bottom: 1px solid #1683ff;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            color: #1683ff;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 8px;
            padding: 11px 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .dashboard-btn {
            background: #1683ff;
            color: #ffffff;
        }

        .logout-btn {
            background: #222222;
            color: #ffffff;
            border: 1px solid #444444;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 25px 18px 50px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #0d0d0d;
            border: 1px solid #222222;
            border-radius: 12px;
            padding: 20px;
        }

        .stat-card h3 {
            margin: 0 0 8px;
            font-size: 14px;
            color: #aaaaaa;
        }

        .stat-card strong {
            font-size: 28px;
            color: #1683ff;
        }

        .section {
            background: #0b0b0b;
            border: 1px solid #222222;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 22px;
        }

        .section h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #cccccc;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            background: #111111;
            border: 1px solid #333333;
            color: #ffffff;
            border-radius: 8px;
            padding: 12px;
            outline: none;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #1683ff;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .save-btn {
            background: #1683ff;
            color: #ffffff;
        }

        .cancel-btn {
            background: #222222;
            color: #ffffff;
            display: none;
        }

        .search-box {
            margin-bottom: 18px;
        }

        .course-list {
            display: grid;
            gap: 15px;
        }

        .course-card {
            background: #111111;
            border: 1px solid #292929;
            border-radius: 12px;
            padding: 18px;
        }

        .course-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: flex-start;
        }

        .course-title {
            margin: 0 0 6px;
            font-size: 19px;
        }

        .course-id {
            color: #888888;
            font-size: 13px;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .active {
            background: rgba(22, 131, 255, 0.15);
            color: #1683ff;
        }

        .inactive {
            background: #252525;
            color: #aaaaaa;
        }

        .course-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 18px;
        }

        .info-box {
            background: #090909;
            border-radius: 8px;
            padding: 12px;
        }

        .info-box small {
            display: block;
            color: #777777;
            margin-bottom: 5px;
        }

        .info-box strong {
            font-size: 14px;
        }

        .course-description {
            margin-top: 18px;
            color: #cccccc;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .course-extra {
            margin-top: 18px;
            border-top: 1px solid #252525;
            padding-top: 18px;
        }

        .course-extra h4 {
            margin: 0 0 8px;
            color: #1683ff;
            font-size: 15px;
        }

        .course-extra p {
            margin: 0 0 18px;
            color: #cccccc;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .course-actions {
            display: flex;
            gap: 8px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .edit-btn {
            background: #1683ff;
            color: #ffffff;
        }

        .toggle-btn {
            background: #222222;
            color: #ffffff;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #777777;
        }

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .course-info {
                grid-template-columns: repeat(2, 1fr);
            }

            .course-top {
                flex-direction: column;
            }
        }

        @media (max-width: 500px) {

            header {
                align-items: flex-start;
                flex-direction: column;
            }

            .header-actions {
                width: 100%;
            }

            .header-actions button {
                flex: 1;
            }

            .course-info {
                grid-template-columns: 1fr;
            }

            .section {
                padding: 16px;
            }
        }

    </style>

</head>

<body>

<header>

    <h1>STI Academy | Courses</h1>

    <div class="header-actions">

        <button
            class="dashboard-btn"
            id="dashboardBtn"
        >
            Dashboard
        </button>

        <button
            class="logout-btn"
            id="logoutBtn"
        >
            Sign Out
        </button>

    </div>

</header>


<div class="container">


    <div class="stats">

        <div class="stat-card">
            <h3>Total Courses</h3>
            <strong id="totalCourses">0</strong>
        </div>

        <div class="stat-card">
            <h3>Active Courses</h3>
            <strong id="activeCourses">0</strong>
        </div>

        <div class="stat-card">
            <h3>Inactive Courses</h3>
            <strong id="inactiveCourses">0</strong>
        </div>

    </div>


    <div class="section">

        <h2 id="formTitle">Add Course</h2>

        <form id="courseForm">

            <div class="form-grid">


                <div>

                    <label for="courseId">
                        Course ID
                    </label>

                    <input
                        type="text"
                        id="courseId"
                        placeholder="Example: WD001"
                        required
                    >

                </div>


                <div>

                    <label for="courseName">
                        Course Name
                    </label>

                    <input
                        type="text"
                        id="courseName"
                        placeholder="Example: Web Development"
                        required
                    >

                </div>


                <div>

                    <label for="department">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        placeholder="Example: Web Development"
                        required
                    >

                </div>


                <div>

                    <label for="durationValue">
                        Duration
                    </label>

                    <input
                        type="number"
                        id="durationValue"
                        min="1"
                        placeholder="6"
                        required
                    >

                </div>


                <div>

                    <label for="durationUnit">
                        Duration Unit
                    </label>

                    <select
                        id="durationUnit"
                        required
                    >

                        <option value="month">
                            Month
                        </option>

                        <option value="months">
                            Months
                        </option>

                        <option value="week">
                            Week
                        </option>

                        <option value="weeks">
                            Weeks
                        </option>

                        <option value="year">
                            Year
                        </option>

                        <option value="years">
                            Years
                        </option>

                    </select>

                </div>


                <div>

                    <label for="monthlyFee">
                        Monthly Fee
                    </label>

                    <input
                        type="number"
                        id="monthlyFee"
                        min="0"
                        placeholder="10000"
                        required
                    >

                </div>


                <div>

                    <label for="totalFee">
                        Total Fee
                    </label>

                    <input
                        type="number"
                        id="totalFee"
                        min="0"
                        placeholder="60000"
                        required
                    >

                </div>


                <div>

                    <label for="courseStatus">
                        Course Status
                    </label>

                    <select
                        id="courseStatus"
                        required
                    >

                        <option value="active">
                            Active
                        </option>

                        <option value="inactive">
                            Inactive
                        </option>

                    </select>

                </div>


                <div class="full">

                    <label for="description">
                        Course Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Brief description of the course..."
                        required
                    ></textarea>

                </div>


                <!-- NEW FIELD 1 -->

                <div class="full">

                    <label for="aboutCourse">
                        About This Course
                    </label>

                    <textarea
                        id="aboutCourse"
                        placeholder="Explain what this course is about..."
                    ></textarea>

                </div>


                <!-- NEW FIELD 2 -->

                <div class="full">

                    <label for="whatYouLearn">
                        What You'll Learn
                    </label>

                    <textarea
                        id="whatYouLearn"
                        placeholder="List the main skills and topics students will learn..."
                    ></textarea>

                </div>


                <!-- NEW FIELD 3 -->

                <div class="full">

                    <label for="whatYouCanDo">
                        What You Can Do With This Skill
                    </label>

                    <textarea
                        id="whatYouCanDo"
                        placeholder="Explain what students can create, work on or do with this skill..."
                    ></textarea>

                </div>


                <!-- NEW FIELD 4 -->

                <div class="full">

                    <label for="funFact">
                        Fun Fact
                    </label>

                    <textarea
                        id="funFact"
                        placeholder="Add an interesting fact about this course or skill..."
                    ></textarea>

                </div>

            </div>


            <div class="form-buttons">

                <button
                    type="submit"
                    class="save-btn"
                    id="saveBtn"
                >
                    Add Course
                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelBtn"
                >
                    Cancel
                </button>

            </div>

        </form>

    </div>


    <div class="section">

        <h2>Courses</h2>

        <div class="search-box">

            <input
                type="text"
                id="courseSearch"
                placeholder="Search by course name, ID or department..."
            >

        </div>

        <div
            class="course-list"
            id="courseList"
        ></div>

    </div>


</div>


<script>

const firebaseConfig = {
    apiKey: "AIzaSyBHa_irkP8QFgCQjUqTKlqdmv5cf8Ec4hg",
    authDomain: "sti-academy.firebaseapp.com",
    projectId: "sti-academy",
    storageBucket: "sti-academy.firebasestorage.app",
    messagingSenderId: "709840641262",
    appId: "1:709840641262:web:714b09bf661afa159f27ff",
    measurementId: "G-7ZRZ3P28YP"
};


if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}


const auth = firebase.auth();
const db = firebase.firestore();


let allCourses = [];
let editingCourseId = null;


/* =========================
   AUTH
========================= */

auth.onAuthStateChanged(
    async user => {

        if (!user) {
            window.location.href = "../login.html";
            return;
        }

        try {

            const adminDoc =
                await db
                    .collection("users")
                    .doc(user.uid)
                    .get();


            if (!adminDoc.exists) {

                alert("Admin account not found.");

                await auth.signOut();

                window.location.href = "../login.html";

                return;
            }


            const adminData = adminDoc.data();


            if (adminData.role !== "admin") {

                alert("You do not have admin access.");

                await auth.signOut();

                window.location.href = "../login.html";

                return;
            }


            loadCourses();

        } catch (error) {

            console.error(error);

            alert(
                "Unable to verify admin access."
            );

        }

    }
);


/* =========================
   LOAD COURSES
========================= */

async function loadCourses() {

    try {

        const snapshot =
            await db
                .collection("courses")
                .orderBy("createdAt", "desc")
                .get();


        allCourses = snapshot.docs.map(
            doc => ({
                id: doc.id,
                ...doc.data()
            })
        );


        updateStats();

        renderCourses(allCourses);

    } catch (error) {

        console.error(error);

        /*
         * Keep the existing course page working
         * even if createdAt ordering causes a
         * Firestore issue.
         */

        try {

            const snapshot =
                await db
                    .collection("courses")
                    .get();


            allCourses = snapshot.docs.map(
                doc => ({
                    id: doc.id,
                    ...doc.data()
                })
            );


            updateStats();

            renderCourses(allCourses);

        } catch (secondError) {

            console.error(secondError);

            alert(
                "Unable to load courses."
            );

        }

    }

}


/* =========================
   STATS
========================= */

function updateStats() {

    const total =
        allCourses.length;


    const active =
        allCourses.filter(
            course =>
                course.status === "active"
        ).length;


    const inactive =
        allCourses.filter(
            course =>
                course.status !== "active"
        ).length;


    document.getElementById(
        "totalCourses"
    ).textContent = total;


    document.getElementById(
        "activeCourses"
    ).textContent = active;


    document.getElementById(
        "inactiveCourses"
    ).textContent = inactive;

}


/* =========================
   RENDER COURSES
========================= */

function renderCourses(courses) {

    const courseList =
        document.getElementById(
            "courseList"
        );


    if (!courses.length) {

        courseList.innerHTML = `
            <div class="empty">
                No courses found.
            </div>
        `;

        return;
    }


    courseList.innerHTML =
        courses.map(course => {


            const status =
                course.status || "inactive";


            const duration =
                `${course.durationValue || ""} ${course.durationUnit || ""}`;


            return `

                <div class="course-card">


                    <div class="course-top">

                        <div>

                            <h3 class="course-title">
                                ${escapeHtml(
                                    course.courseName || ""
                                )}
                            </h3>

                            <div class="course-id">
                                ID:
                                ${escapeHtml(
                                    course.courseId || course.id
                                )}
                            </div>

                        </div>


                        <span
                            class="status ${
                                status === "active"
                                    ? "active"
                                    : "inactive"
                            }"
                        >
                            ${status === "active"
                                ? "Active"
                                : "Inactive"}
                        </span>

                    </div>


                    <div class="course-info">


                        <div class="info-box">

                            <small>
                                Department
                            </small>

                            <strong>
                                ${escapeHtml(
                                    course.department || "-"
                                )}
                            </strong>

                        </div>


                        <div class="info-box">

                            <small>
                                Duration
                            </small>

                            <strong>
                                ${escapeHtml(
                                    duration || "-"
                                )}
                            </strong>

                        </div>


                        <div class="info-box">

                            <small>
                                Monthly Fee
                            </small>

                            <strong>
                                ${formatMoney(
                                    course.monthlyFee
                                )}
                            </strong>

                        </div>


                        <div class="info-box">

                            <small>
                                Total Fee
                            </small>

                            <strong>
                                ${formatMoney(
                                    course.totalFee
                                )}
                            </strong>

                        </div>


                    </div>


                    <div class="course-description">

                        ${escapeHtml(
                            course.description || ""
                        )}

                    </div>


                    ${
                        course.aboutCourse ||
                        course.whatYouLearn ||
                        course.whatYouCanDo ||
                        course.funFact
                        ? `

                            <div class="course-extra">


                                ${
                                    course.aboutCourse
                                    ? `

                                        <h4>
                                            About This Course
                                        </h4>

                                        <p>
                                            ${escapeHtml(
                                                course.aboutCourse
                                            )}
                                        </p>

                                    `
                                    : ""
                                }


                                ${
                                    course.whatYouLearn
                                    ? `

                                        <h4>
                                            What You'll Learn
                                        </h4>

                                        <p>
                                            ${escapeHtml(
                                                course.whatYouLearn
                                            )}
                                        </p>

                                    `
                                    : ""
                                }


                                ${
                                    course.whatYouCanDo
                                    ? `

                                        <h4>
                                            What You Can Do With This Skill
                                        </h4>

                                        <p>
                                            ${escapeHtml(
                                                course.whatYouCanDo
                                            )}
                                        </p>

                                    `
                                    : ""
                                }


                                ${
                                    course.funFact
                                    ? `

                                        <h4>
                                            Fun Fact
                                        </h4>

                                        <p>
                                            ${escapeHtml(
                                                course.funFact
                                            )}
                                        </p>

                                    `
                                    : ""
                                }


                            </div>

                        `
                        : ""
                    }


                    <div class="course-actions">


                        <button
                            class="edit-btn"
                            onclick="editCourse('${escapeAttribute(course.id)}')"
                        >
                            Edit
                        </button>


                        <button
                            class="toggle-btn"
                            onclick="toggleCourse('${escapeAttribute(course.id)}')"
                        >
                            ${
                                status === "active"
                                    ? "Deactivate"
                                    : "Activate"
                            }
                        </button>


                    </div>


                </div>

            `;

        }).join("");

}


/* =========================
   ADD / UPDATE COURSE
========================= */

document
    .getElementById("courseForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const courseId =
                document
                    .getElementById("courseId")
                    .value
                    .trim();


            const courseName =
                document
                    .getElementById("courseName")
                    .value
                    .trim();


            const department =
                document
                    .getElementById("department")
                    .value
                    .trim();


            const durationValue =
                Number(
                    document
                        .getElementById("durationValue")
                        .value
                );


            const durationUnit =
                document
                    .getElementById("durationUnit")
                    .value;


            const monthlyFee =
                Number(
                    document
                        .getElementById("monthlyFee")
                        .value
                );


            const totalFee =
                Number(
                    document
                        .getElementById("totalFee")
                        .value
                );


            const status =
                document
                    .getElementById("courseStatus")
                    .value;


            const description =
                document
                    .getElementById("description")
                    .value
                    .trim();


            /*
             * NEW FIELDS
             */

            const aboutCourse =
                document
                    .getElementById("aboutCourse")
                    .value
                    .trim();


            const whatYouLearn =
                document
                    .getElementById("whatYouLearn")
                    .value
                    .trim();


            const whatYouCanDo =
                document
                    .getElementById("whatYouCanDo")
                    .value
                    .trim();


            const funFact =
                document
                    .getElementById("funFact")
                    .value
                    .trim();


            if (!courseId ||
                !courseName ||
                !department ||
                !durationValue ||
                !description) {

                alert(
                    "Please fill all required fields."
                );

                return;
            }


            const user =
                auth.currentUser;


            if (!user) {

                alert(
                    "No admin account is currently logged in."
                );

                return;
            }


            const saveBtn =
                document.getElementById(
                    "saveBtn"
                );


            saveBtn.disabled = true;

            saveBtn.textContent =
                "Saving...";


            try {


                if (editingCourseId) {

                    await db
                        .collection("courses")
                        .doc(editingCourseId)
                        .update({

                            courseId,
                            courseName,
                            department,
                            durationValue,
                            durationUnit,
                            monthlyFee,
                            totalFee,
                            status,
                            description,

                            /*
                             * NEW FIELDS
                             */

                            aboutCourse,
                            whatYouLearn,
                            whatYouCanDo,
                            funFact,

                            updatedAt:
                                firebase.firestore.FieldValue.serverTimestamp(),

                            updatedBy:
                                user.uid

                        });


                    alert(
                        "Course updated successfully."
                    );


                } else {


                    const existing =
                        await db
                            .collection("courses")
                            .doc(courseId)
                            .get();


                    if (existing.exists) {

                        alert(
                            "A course with this Course ID already exists."
                        );

                        return;
                    }


                    await db
                        .collection("courses")
                        .doc(courseId)
                        .set({

                            courseId,
                            courseName,
                            department,
                            durationValue,
                            durationUnit,
                            monthlyFee,
                            totalFee,
                            status,
                            description,

                            /*
                             * NEW FIELDS
                             */

                            aboutCourse,
                            whatYouLearn,
                            whatYouCanDo,
                            funFact,

                            createdAt:
                                firebase.firestore.FieldValue.serverTimestamp(),

                            createdBy:
                                user.uid

                        });


                    alert(
                        "Course added successfully."
                    );

                }


                resetForm();

                await loadCourses();


            } catch (error) {

                console.error(error);

                alert(
                    "Unable to save course."
                );

            } finally {

                saveBtn.disabled = false;

                saveBtn.textContent =
                    editingCourseId
                        ? "Update Course"
                        : "Add Course";

            }

        }
    );


/* =========================
   EDIT COURSE
========================= */

function editCourse(docId) {

    const course =
        allCourses.find(
            item => item.id === docId
        );


    if (!course) {

        alert(
            "Course not found."
        );

        return;
    }


    editingCourseId = docId;


    document.getElementById(
        "courseId"
    ).value =
        course.courseId || "";


    document.getElementById(
        "courseName"
    ).value =
        course.courseName || "";


    document.getElementById(
        "department"
    ).value =
        course.department || "";


    document.getElementById(
        "durationValue"
    ).value =
        course.durationValue || "";


    document.getElementById(
        "durationUnit"
    ).value =
        course.durationUnit || "month";


    document.getElementById(
        "monthlyFee"
    ).value =
        course.monthlyFee || "";


    document.getElementById(
        "totalFee"
    ).value =
        course.totalFee || "";


    document.getElementById(
        "courseStatus"
    ).value =
        course.status || "active";


    document.getElementById(
        "description"
    ).value =
        course.description || "";


    /*
     * NEW FIELDS
     */

    document.getElementById(
        "aboutCourse"
    ).value =
        course.aboutCourse || "";


    document.getElementById(
        "whatYouLearn"
    ).value =
        course.whatYouLearn || "";


    document.getElementById(
        "whatYouCanDo"
    ).value =
        course.whatYouCanDo || "";


    document.getElementById(
        "funFact"
    ).value =
        course.funFact || "";


    document.getElementById(
        "courseId"
    ).disabled = true;


    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit Course";


    document.getElementById(
        "saveBtn"
    ).textContent =
        "Update Course";


    document.getElementById(
        "cancelBtn"
    ).style.display =
        "inline-block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================
   TOGGLE COURSE
========================= */

async function toggleCourse(docId) {

    const course =
        allCourses.find(
            item => item.id === docId
        );


    if (!course) {

        alert(
            "Course not found."
        );

        return;
    }


    const newStatus =
        course.status === "active"
            ? "inactive"
            : "active";


    try {

        await db
            .collection("courses")
            .doc(docId)
            .update({

                status: newStatus,

                updatedAt:
                    firebase.firestore.FieldValue.serverTimestamp(),

                updatedBy:
                    auth.currentUser.uid

            });


        await loadCourses();


    } catch (error) {

        console.error(error);

        alert(
            "Unable to change course status."
        );

    }

}


/* =========================
   CANCEL EDIT
========================= */

document
    .getElementById("cancelBtn")
    .addEventListener(
        "click",
        function() {

            resetForm();

        }
    );


function resetForm() {

    editingCourseId = null;


    document
        .getElementById("courseForm")
        .reset();


    document.getElementById(
        "courseId"
    ).disabled = false;


    document.getElementById(
        "courseStatus"
    ).value = "active";


    document.getElementById(
        "durationUnit"
    ).value = "month";


    document.getElementById(
        "formTitle"
    ).textContent =
        "Add Course";


    document.getElementById(
        "saveBtn"
    ).textContent =
        "Add Course";


    document.getElementById(
        "cancelBtn"
    ).style.display =
        "none";

}


/* =========================
   SEARCH
========================= */

document
    .getElementById("courseSearch")
    .addEventListener(
        "input",
        function() {

            const search =
                this.value
                    .trim()
                    .toLowerCase();


            if (!search) {

                renderCourses(
                    allCourses
                );

                return;
            }


            const filtered =
                allCourses.filter(
                    course => {

                        const name =
                            String(
                                course.courseName || ""
                            ).toLowerCase();


                        const id =
                            String(
                                course.courseId || ""
                            ).toLowerCase();


                        const department =
                            String(
                                course.department || ""
                            ).toLowerCase();


                        return (
                            name.includes(search) ||
                            id.includes(search) ||
                            department.includes(search)
                        );

                    }
                );


            renderCourses(filtered);

        }
    );

/* =========================
   HELPERS
========================= */

function formatMoney(value) {

    const number =
        Number(value || 0);


    return "₦" +
        number.toLocaleString(
            "en-NG"
        );

}


function escapeHtml(value) {

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value) {

    return String(value || "")
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}
