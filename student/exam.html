/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   ERROR
========================================= */

function showError(message) {

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "examContent"
    ).style.display =
        "none";

        document.getElementById(
            "error"
        );


    error.textContent =
        message;


    error.style.display =
        "block";

}


/* =========================================
   TIMESTAMP HELPERS
========================================= */

function timestampToDate(
    timestamp
) {

    if (!timestamp) {

        return null;

    }


    if (
        typeof timestamp.toDate ===
        "function"
    ) {

        return timestamp.toDate();

    }


    if (
        typeof timestamp.seconds ===
        "number"
    ) {

        return new Date(
            timestamp.seconds * 1000
        );

    }


    const date =
        new Date(timestamp);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return null;

    }


    return date;

}


/* =========================================
   STUDENT HELPERS
========================================= */

function getStudentName() {

    return (
        studentData?.fullName ||
        studentData?.name ||
        "Student"
    );

}


function getStudentId() {

    return (
        studentData?.studentId ||
        studentData?.studentID ||
        ""
    );

}


/* =========================================
   TIME
========================================= */

function formatTime(
    totalSeconds
) {

    totalSeconds =
        Math.max(
            0,
            Math.floor(
                totalSeconds
            )
        );


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    if (
        hours > 0
    ) {

        return (
            String(hours)
                .padStart(2, "0") +
            ":" +
            String(minutes)
                .padStart(2, "0") +
            ":" +
            String(seconds)
                .padStart(2, "0")
        );

    }


    return (
        String(minutes)
            .padStart(2, "0") +
        ":" +
        String(seconds)
            .padStart(2, "0")
    );

}


/* =========================================
   ANSWERS
========================================= */

function getAnswer(question) {

    return (
        answers[question.id] ??
        ""
    );

}


function isAnswered(question) {

    const answer =
        getAnswer(question);


    return (
        answer !== null &&
        answer !== undefined &&
        String(answer)
            .trim() !== ""
    );

}


function countAnswered() {

    return questions.filter(
        question =>
            isAnswered(question)
    ).length;

}


/* =========================================
   PROGRESS
========================================= */

function updateProgress() {

    const total =
        questions.length;


    const current =
        currentQuestion + 1;


    document.getElementById(
        "progressText"
    ).textContent =
        `Question ${current} of ${total}`;


    document.getElementById(
        "answeredText"
    ).textContent =
        `${countAnswered()} answered`;


    const percentage =
        total > 0
            ? (current / total) * 100
            : 0;


    document.getElementById(
        "progressBar"
    ).style.width =
        `${percentage}%`;

}


/* =========================================
   RENDER QUESTION
========================================= */

function renderQuestion() {

    if (
        !questions.length
    ) {

        return;

    }


    const question =
        questions[
            currentQuestion
        ];


    const card =
        document.getElementById(
            "questionCard"
        );


    let html = "";


    html += `

        <div class="question-number">

            Question ${
                question.questionNumber ||
                currentQuestion + 1
            }

        </div>


        <div class="question-text">

            ${escapeHtml(
                question.question ||
                ""
            )}

        </div>


        <div class="marks">

            ${Number(
                question.marks || 0
            )}

            mark${
                Number(
                    question.marks || 0
                ) === 1
                    ? ""
                    : "s"
            }

        </div>

    `;


    if (
        question.type ===
        "objective"
    ) {

        const options =
            question.options || {};


        ["A", "B", "C", "D"]
            .forEach(
                letter => {

                    if (
                        options[letter] ===
                        undefined
                    ) {

                        return;

                    }


                    const selected =
                        String(
                            getAnswer(
                                question
                            )
                        ).toLowerCase() ===
                        letter.toLowerCase();


                    html += `

                        <label
                            class="option ${
                                selected
                                    ? "selected"
                                    : ""
                            }"
                        >

                            <input
                                type="radio"
                                name="question-${
                                    escapeHtml(
                                        question.id
                                    )
                                }"
                                value="${letter}"
                                ${
                                    selected
                                        ? "checked"
                                        : ""
                                }
                                onchange="selectObjectiveAnswer(
                                    '${escapeHtml(
                                        question.id
                                    )}',
                                    '${letter}'
                                )"
                            >

                            <strong>
                                ${letter}.
                            </strong>

                            ${escapeHtml(
                                options[letter]
                            )}

                        </label>

                    `;

                }
            );


    } else {

        html += `

            <textarea
                id="theoryAnswer"
                placeholder="Type your answer here..."
                oninput="saveTheoryAnswer()"
            >${escapeHtml(
                getAnswer(question)
            )}</textarea>    `;

}


card.innerHTML =
    html;


document.getElementById(
    "previousButton"
).disabled =
    currentQuestion === 0;


if (
    currentQuestion ===
    questions.length - 1
) {

    document.getElementById(
        "nextButton"
    ).style.display =
        "none";


    document.getElementById(
        "submitButton"
    ).style.display =
        "block";


} else {

    document.getElementById(
        "nextButton"
    ).style.display =
        "block";


    document.getElementById(
        "submitButton"
    ).style.display =
        "none";

}


renderQuestionMap();

updateProgress();

}

/* =========================================
OBJECTIVE ANSWER
========================================= */

function selectObjectiveAnswer(
questionId,
answer
) {

answers[questionId] =
    answer;


renderQuestion();

}

/* =========================================
THEORY ANSWER
========================================= */

function saveTheoryAnswer() {

const question =
    questions[
        currentQuestion
    ];


if (!question) {

    return;

}


const textarea =
    document.getElementById(
        "theoryAnswer"
    );


if (!textarea) {

    return;

}


answers[question.id] =
    textarea.value;


updateProgress();

renderQuestionMap();

}

/* =========================================
SAVE CURRENT ANSWER
========================================= */

function saveCurrentAnswer() {

const question =
    questions[
        currentQuestion
    ];


if (!question) {

    return;

}


if (
    question.type ===
    "theory"
) {

    const textarea =
        document.getElementById(
            "theoryAnswer"
        );


    if (textarea) {

        answers[question.id] =
            textarea.value;

    }

}

}

/* =========================================
NAVIGATION
========================================= */

function nextQuestion() {

saveCurrentAnswer();


if (
    currentQuestion <
    questions.length - 1
) {

    currentQuestion++;

    renderQuestion();

}

}

function previousQuestion() {

saveCurrentAnswer();


if (
    currentQuestion > 0
) {

    currentQuestion--;

    renderQuestion();

}

}

/* =========================================
QUESTION MAP
========================================= */

function renderQuestionMap() {

const map =
    document.getElementById(
        "questionMap"
    );


map.innerHTML =
    "";


questions.forEach(
    (question, index) => {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "map-btn";


        button.type =
            "button";


        button.textContent =
            question.questionNumber ||
            index + 1;


        if (
            index ===
            currentQuestion
        ) {

            button.classList.add(
                "current"
            );

        }


        if (
            isAnswered(question)
        ) {

            button.classList.add(
                "answered"
            );

        }


        button.onclick =
            () => {

                saveCurrentAnswer();

                currentQuestion =
                    index;

                renderQuestion();

            };


        map.appendChild(
            button
        );

    }
);

}

/* =========================================
FIND EXISTING SUBMISSION
========================================= */

async function checkExistingSubmission() {

const snapshot =
    await db
        .collection(
            "examSubmissions"
        )
        .where(
            "examId",
            "==",
            examId
        )
        .where(
            "studentUid",
            "==",
            currentUser.uid
        )
        .limit(1)
        .get();


if (
    snapshot.empty
) {

    return null;

}


return {

    id:
        snapshot.docs[0].id,

    ...snapshot.docs[0].data()

};

}

/* =========================================
RESTORE ANSWERS
========================================= */

function restoreExistingAnswers(
submission
) {

if (!submission) {

    return;

}


const saved =
    submission.answers ||
    submission.responses ||
    {};


if (
    Array.isArray(saved)
) {

    saved.forEach(
        item => {

            if (!item) {

                return;

            }


            const questionId =
                item.questionId;


            if (!questionId) {

                return;

            }


            answers[questionId] =
                item.answer ??
                item.selectedAnswer ??
                item.response ??
                "";

        }
    );


} else {

    Object.keys(saved)
        .forEach(
            key => {

                answers[key] =
                    saved[key];

            }
        );

}

}

/* =========================================
CREATE FIRST ATTEMPT
========================================= */

async function createFirstAttempt() {

const now =
    new Date();


const scheduleStart =
    timestampToDate(
        exam.startTime
    );


const scheduleEnd =
    timestampToDate(
        exam.endTime
    );


if (
    scheduleStart &&
    now < scheduleStart
) {

    throw new Error(
        "This exam has not started yet."
    );

}


if (
    scheduleEnd &&
    now >= scheduleEnd
) {

    throw new Error(
        "This exam has already ended."
    );

}


const durationMinutes =
    Number(
        exam.durationMinutes ??
        exam.duration ??
        0
    );


if (
    !durationMinutes ||
    durationMinutes <= 0
) {

    throw new Error(
        "This exam does not have a valid duration."
    );

}


const startedAt =
    firebase.firestore.Timestamp
        .fromDate(
            now
        );


const data = {

    examId:
        exam.id,

    studentUid:
        currentUser.uid,

    studentId:
        getStudentId(),

    studentName:
        getStudentName(),

    course:
        exam.course ||
        "",

    department:
        exam.department ||
        "",

    answers:
        {},

    answeredCount:
        0,

    startedAt,

    submitted:
        false,

    status:
        "In Progress",

    createdAt:
        firebase.firestore
            .FieldValue
            .serverTimestamp(),

    updatedAt:
        firebase.firestore
            .FieldValue
            .serverTimestamp()

};


const ref =
    await db
        .collection(
            "examSubmissions"
        )
        .add(data);


existingSubmission = {

    id:
        ref.id,

    ...data

};


return startedAt;

}

/* =========================================
GET DEADLINE
========================================= */

function calculateDeadline() {

if (
    !existingSubmission ||
    !existingSubmission.startedAt
) {

    return 0;

}


const startedAt =
    timestampToDate(
        existingSubmission.startedAt
    );


if (!startedAt) {

    return 0;

}


const durationMinutes =
    Number(
        exam.durationMinutes ??
        exam.duration ??
        0
    );


if (
    durationMinutes <= 0
) {

    return 0;

}


const personalDeadline =
    startedAt.getTime() +
    (
        durationMinutes *
        60 *
        1000
    );


const scheduleEnd =
    timestampToDate(
        exam.endTime
    );


if (
    scheduleEnd
) {

    return Math.min(
        personalDeadline,
        scheduleEnd.getTime()
    );

}


return personalDeadline;

}

/* =========================================
START PERSISTENT TIMER
========================================= */

function startTimer() {

deadlineMillis =
    calculateDeadline();


if (
    !deadlineMillis
) {

    document.getElementById(
        "timer"
    ).textContent =
        "--:--";

    return;

}


updateTimer();


if (
    timerInterval
) {

    clearInterval(
        timerInterval
    );

}


timerInterval =
    setInterval(
        updateTimer,
        1000
    );

}

/* =========================================
UPDATE TIMER
========================================= */

function updateTimer() {

if (
    !deadlineMillis
) {

    return;

}


const remainingMillis =
    deadlineMillis -
    Date.now();


const remainingSeconds =
    Math.ceil(
        remainingMillis /
        1000
    );


const timer =
    document.getElementById(
        "timer"
    );


timer.textContent =
    formatTime(
        Math.max(
            remainingSeconds,
            0
        )
    );


timer.classList.remove(
    "warning",
    "danger"
);


if (
    remainingSeconds <= 60
) {

    timer.classList.add(
        "danger"
    );

} else if (
    remainingSeconds <= 300
) {

    timer.classList.add(
        "warning"
    );

}


if (
    remainingSeconds <= 0
) {

    clearInterval(
        timerInterval
    );


    autoSubmitExam();

}

}

/* =========================================
SAVE PROGRESS
========================================= */

async function saveProgress() {

if (
    savingProgress ||
    examSubmitted ||
    !currentUser ||
    !exam ||
    !existingSubmission
) {

    return;

}


saveCurrentAnswer();


savingProgress =
    true;


try {

    await db
        .collection(
            "examSubmissions"
        )
        .doc(
            existingSubmission.id
        )
        .update({

            answers:
                answers,

            answeredCount:
                countAnswered(),

            updatedAt:
                firebase.firestore
                    .FieldValue
                    .serverTimestamp()

        });


} catch (error) {

    console.error(
        "Progress save failed:",
        error
    );

} finally {

    savingProgress =
        false;

}

}

/* =========================================
SUBMIT EXAM
========================================= */

async function submitExam(
automatic = false
) {

if (
    examSubmitted
) {

    return;

}


saveCurrentAnswer();


const unanswered =
    questions.filter(
        question =>
            !isAnswered(question)
    );


if (
    !automatic &&
    unanswered.length > 0
) {

    const proceed =
        confirm(
            `You have ${unanswered.length} unanswered question${
                unanswered.length === 1
                    ? ""
                    : "s"
            }. Are you sure you want to submit?`
        );


    if (!proceed) {

        return;

    }

}


if (
    !automatic &&
    !confirm(
        "Are you sure you want to submit your exam?"
    )
) {

    return;

}


try {

    examSubmitted =
        true;


    if (
        timerInterval
    ) {

        clearInterval(
            timerInterval
        );

    }


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    submitButton.disabled =
        true;


    submitButton.textContent =
        "Submitting...";


    if (
        !existingSubmission
    ) {

        throw new Error(
            "Your exam attempt could not be found. Please reload the exam."
        );

    }


    await db
        .collection(
            "examSubmissions"
        )
        .doc(
            existingSubmission.id
        )
        .update({

            answers:
                answers,

            answeredCount:
                countAnswered(),

            submitted:
                true,

            status:
                "Pending",

            submittedAt:
                firebase.firestore
                    .FieldValue
                    .serverTimestamp(),

            updatedAt:
                firebase.firestore
                    .FieldValue
                    .serverTimestamp()

        });


    existingSubmission.submitted =
        true;


    document.getElementById(
        "examContent"
    ).style.display =
        "none";


    document.getElementById(
        "submitted"
    ).style.display =
        "block";


    document.getElementById(
        "timer"
    ).textContent =
        "Submitted";


} catch (error) {

    console.error(
        "SUBMISSION ERROR:",
        error
    );


    examSubmitted =
        false;


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    submitButton.disabled =
        false;


    submitButton.textContent =
        "Submit Exam";


    alert(
        "Failed to submit exam:\n\n" +
        error.message
    );

}

}

/* =========================================
AUTO SUBMIT
========================================= */

function autoSubmitExam() {

alert(
    "Your exam time has ended. Your exam will now be submitted."
);


submitExam(
    true
);

}

/* =========================================
LEAVE CONFIRMATION
========================================= */

function confirmLeave() {

if (
    examSubmitted
) {

    return true;

}


return confirm(
    "Your exam is in progress. Your timer will continue even if you leave. Are you sure you want to leave?"
);

}

/* =========================================
LOAD EXAM
========================================= */

async function loadExam() {

if (!examId) {

    showError(
        "No exam ID was provided."
    );

    return;

}


try {

    const examSnapshot =
        await db
            .collection(
                "exams"
            )
            .doc(
                examId
            )
            .get();


    if (
        !examSnapshot.exists
    ) {

        showError(
            "Exam not found."
        );

        return;

    }


    exam = {

        id:
            examSnapshot.id,

        ...examSnapshot.data()

    };


    if (
        exam.status !==
        "published"
    ) {

        showError(
            "This exam is not currently available."
        );

        return;

    }


    const now =
        new Date();


    const scheduleStart =
        timestampToDate(
            exam.startTime
        );


    const scheduleEnd =
        timestampToDate(
            exam.endTime
        );


    existingSubmission =
        await checkExistingSubmission();


    /* =========================================
       ALREADY SUBMITTED
    ========================================== */

    if (
        existingSubmission &&
        existingSubmission.submitted === true
    ) {

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "submitted"
        ).style.display =
            "block";


        document.getElementById(
            "timer"
        ).textContent =
            "Submitted";


        document.getElementById(
            "examTitle"
        ).textContent =
            exam.title ||
            "Exam";


        return;

    }


    /* =========================================
       NEW ATTEMPT
    ========================================== */

    if (
        !existingSubmission
    ) {

        if (
            scheduleStart &&
            now < scheduleStart
        ) {

            showError(
                "This exam has not started yet."
            );

            return;

        }


        if (
            scheduleEnd &&
            now >= scheduleEnd
        ) {

            showError(
                "This exam has already ended."
            );

            return;

        }


        await createFirstAttempt();

    }


    /* =========================================
       EXISTING ATTEMPT
    ========================================== */

    if (
        existingSubmission
    ) {

        restoreExistingAnswers(
            existingSubmission
        );

    }


    deadlineMillis =
        calculateDeadline();


    if (
        deadlineMillis <=
        Date.now()
    ) {

        await submitExam(
            true
        );

        return;

    }


    /* =========================================
       LOAD QUESTIONS
    ========================================== */

    const questionSnapshot =
        await db
            .collection(
                "examQuestions"
            )
            .where(
                "examId",
                "==",
                exam.id
            )
            .get();


    questions =
        questionSnapshot.docs
            .map(
                doc => ({

                    id:
                        doc.id,

                    ...doc.data()

                })
            )
            .sort(
                (a, b) =>
                    Number(
                        a.questionNumber ||
                        0
                    ) -
                    Number(
                        b.questionNumber ||
                        0
                    )
            );


    if (
        !questions.length
    ) {

        showError(
            "This exam has no questions yet."
        );

        return;

    }


    document.getElementById(
        "examTitle"
    ).textContent =
        exam.title ||
        "Exam";


    document.getElementById(
        "instructions"
    ).textContent =
        exam.instructions ||
        "Answer all questions carefully before submitting your exam.";


    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "examContent"
    ).style.display =
        "block";


    renderQuestion();


    startTimer();


    setInterval(
        saveProgress,
        15000
    );


} catch (error) {

    console.error(
        "LOAD EXAM ERROR:",
        error
    );


    showError(
        "Failed to load exam: " +
        error.message
    );

}

}

/* =========================================
AUTH
========================================= */

auth.onAuthStateChanged(
async user => {

    if (!user) {

        window.location.href =
            "../login.html";

        return;

    }


    currentUser =
        user;


    try {

        const userSnapshot =
            await db
                .collection(
                    "users"
                )
                .doc(
                    user.uid
                )
                .get();


        if (
            !userSnapshot.exists
        ) {

            showError(
                "Student account was not found."
            );

            return;

        }


        studentData =
            userSnapshot.data();


        if (
            studentData.role !==
            "student"
        ) {

            showError(
                "Access denied. Student access required."
            );

            return;

        }


        await loadExam();


    } catch (error) {

        console.error(
            "AUTH ERROR:",
            error
        );


        showError(
            "Authentication error: " +
            error.message
        );

    }

}

);
